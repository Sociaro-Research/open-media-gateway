name: Bug report
description: Report reproducible incorrect behavior in Media Gateway
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not include credentials, `.env` contents,
        customer data, prompts, generated media, or security vulnerabilities.
        Report vulnerabilities privately according to SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Start with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - mock
        - BytePlus ModelArk
        - Alibaba Cloud Model Studio
        - OpenAI
        - Agnes AI
        - Sonilo
        - Provider-independent
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Docker/Compose or Go version, and deployment shape.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Include only the relevant lines after removing sensitive values.
