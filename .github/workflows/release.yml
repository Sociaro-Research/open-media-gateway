name: Publish GHCR release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag on main
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REPOSITORY" = Sociaro-Research/media-gateway-dev
          test "${RELEASE_REF#refs/tags/}" != "$RELEASE_REF"
          python3 -c 'import re, os; assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?", os.environ["RELEASE_VERSION"])'
          git merge-base --is-ancestor HEAD origin/main
          make release-check
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: [version, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_ARCH: ${{ matrix.arch }}
      REGISTRY_ROOT: ghcr.io/sociaro-research/media-gateway-dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all installation images on native hardware
        run: |
          mkdir -p release-evidence
          for name in gateway ui postgres redis; do
            context=.
            if [ "$name" = ui ]; then context=web; fi
            if [ "$name" = postgres ] || [ "$name" = redis ]; then context="deploy/$name"; fi
            docker buildx build --load --tag "gateway-$name:release-test" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$RELEASE_VERSION" "$context"
          done
      - name: Scan the exact images and retain software inventories
        run: |
          python3 scripts/security/install-tools.py --bin-dir /tmp/release-security-tools
          for name in gateway ui postgres redis; do
            /tmp/release-security-tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "gateway-$name:release-test"
            /tmp/release-security-tools/trivy image --format cyclonedx --output "release-evidence/$name-$RELEASE_ARCH.cdx.json" "gateway-$name:release-test"
          done
      - name: Verify a source-free installation and restart
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_release*.py' -v
          python3 scripts/verify-release.py --version "$RELEASE_VERSION" \
            --gateway gateway-gateway:release-test --ui gateway-ui:release-test \
            --postgres gateway-postgres:release-test --redis gateway-redis:release-test
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push only verified images
        run: |
          for name in gateway ui postgres redis; do
            candidate="$REGISTRY_ROOT/$name:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RELEASE_ARCH"
            docker tag "gateway-$name:release-test" "$candidate"
            docker push "$candidate"
            docker inspect --format '{{index .RepoDigests 0}}' "$candidate" > "release-evidence/$name-$RELEASE_ARCH.digest"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: release-evidence
          retention-days: 14

  publish:
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      REGISTRY_ROOT: ghcr.io/sociaro-research/media-gateway-dev
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-evidence
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable version manifests
        run: python3 scripts/publish-release.py --version "$RELEASE_VERSION" --evidence release-evidence --output dist/releases
      - name: Assemble installation bundle
        run: |
          python3 scripts/package-release.py --version "$RELEASE_VERSION" --images dist/releases/images.json --output dist/releases
          cp release-evidence/*.cdx.json dist/releases/
      - name: Pull the published digests and verify installation
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          images = json.load(open('dist/releases/images.json'))
          arguments = ['python3', 'scripts/verify-release.py', '--version', os.environ['RELEASE_VERSION']]
          for name, ref in images.items():
              subprocess.run(['docker', 'pull', ref], check=True)
              arguments.extend(['--' + name, ref])
          subprocess.run(arguments, check=True)
          PY
      - name: Publish GitHub release and downloads
        run: |
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_VERSION" dist/releases/* \
            --verify-tag --title "Media Gateway $RELEASE_VERSION" --notes-file deploy/ghcr/release-notes.md "${prerelease[@]}"
