    MediaType:
      type: string
      enum:
      - image
      - video
      - speech
      - music
      - audio
    MediaOptions:
      type: object
      additionalProperties: false
      properties:
        parameters:
          type: object
          additionalProperties: true
          description: Additional controls declared by MediaModel.parameters. Unknown keys and invalid types are rejected.
        duration:
          type: integer
          minimum: 0
          description: Music or audio output duration in seconds, when advertised by the model. Video requests use the top-level seconds field. Fractional effects may declare a number parameter instead.
        ratio:
          type: string
          description: Video aspect ratio from the catalog, for example 16:9.
        generate_audio:
          type: boolean
          description: Request synchronized audio when supports_audio is true.
        watermark:
          type: boolean
          description: Provider watermark preference, subject to provider support.
        camera_fixed:
          type: boolean
          description: Fixed camera; omit if supports_camera_fixed is false.
        draft:
          type: boolean
          description: Preview generation when supports_draft is true; use draft_resolutions
            when listed.
        seed:
          type: integer
          format: int64
          description: Video random seed from 0 to 4294967295; omit for provider randomness.
          minimum: 0
          maximum: 4294967295
        return_last_frame:
          type: boolean
          description: Return the final video frame when supports_last_frame is true.
        negative_prompt:
          type: string
          description: Exclusions for models with supports_negative_prompt.
        reference_voices:
          type: object
          additionalProperties: {type: string, format: uri}
          description: Wan 2.7 reference-to-video only. Maps an ordinary image/video URL to its voice audio URL. First frames cannot have a voice. WAV or MP3, 1–10 seconds, at most 15 MB. Defaults to the reference video's original voice when omitted.
        reference_mode:
          type: string
          description: Select an ID from the model's reference_modes. This determines image order and native roles. If omitted, the model selects its default reference mode. first_frame_references uses its first image as the first frame; remaining images are ordinary references.
        video_urls:
          type: array
          items: {type: string, format: uri}
          description: Video references in order. Models advertising supports_asset_references also accept asset://ID entries, mixed with URLs. Respect the selected reference mode's count limits.
        audio_urls:
          type: array
          items: {type: string, format: uri}
          description: Audio references or driving audio according to the selected mode. Models advertising supports_asset_references also accept asset://ID entries, mixed with URLs.
        language:
          type: string
          description: Speech language, subject to the model; for example English
            or Auto.
        lyrics:
          type: string
          description: Music lyrics when supports_lyrics is true.
        gender:
          type: string
          enum:
          - female
          - male
          description: Vocal gender when supports_gender is true.
        format:
          type: string
          description: Output format from the model’s formats list.
    ProviderUsage:
      type: object
