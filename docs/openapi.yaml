    RevokedKey:
      type: object
      description: Snapshot contains immutable alias, prefix, organization, owner/creator/revoker IDs and email labels, dates, scopes, expiry/resource settings, revocation reason, correlation ID, known spend in integer USD micros and pending/unknown counts at revocation. Budget is null because keys have no individual budgets. history_complete=false marks migrated records whose revoking actor and original spend were not recorded. Current lifetime values are separate and can change after reconciliation.
      properties:
