          type: string
        description:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        credential_source:
          type: string
        credential_hint:
          type: string
          readOnly: true
        base_url:
          type: string
        music_configured:
          type: boolean
        music_credential_hint:
          type: string
          readOnly: true
        music_base_url:
          type: string
        billing_configured:
          type: boolean
        billing_access_key_hint:
          type: string
          readOnly: true
        region:
          type: string
        status:
          type: string
        status_message:
          type: string
        last_checked_at:
          type: string
          format: date-time
