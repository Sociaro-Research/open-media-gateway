      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        content_type: {type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/quicktime, video/webm, audio/mpeg, audio/wave, audio/wav, audio/x-wav, audio/ogg, audio/flac]}
        size_bytes: {type: integer, minimum: 1, maximum: 209715200}
        created_at: {type: string, format: date-time}
