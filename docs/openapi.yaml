    put:
      operationId: put_v1_system_model_settings_modelId
      tags: [System]
      summary: Rename a model or change its default availability
      description: Administrator only. Public IDs are unique and case-sensitive; the previous name is not retained as an alias. Changes affect new requests; accepted generations retain their public-name snapshot.
