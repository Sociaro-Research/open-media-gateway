        asset_project: {type: string, default: default, description: Library project; must match the inference endpoint project.}
        asset_region: {type: string, default: ap-southeast-1, description: Johor asset management region.}
        music_api_key:
          type: string
          writeOnly: true
          description: Write-only provider secret; omitted keeps the saved value; an empty string clears it.
        music_base_url:
          type: string
          format: uri
          description: Provider endpoint override; omitted keeps the saved value; an empty string restores the default.
        billing_access_key_id:
          type: string
          writeOnly: true
          description: Write-only provider secret; omitted keeps the saved value; an empty string clears it.
        billing_access_key_secret:
          type: string
          writeOnly: true
          description: Write-only provider secret; omitted keeps the saved value; an empty string clears it.
      description: 'Fields are declared in AdminProvider.fields; unsupported keys are rejected. PUT acts as a partial update: omitted fields keep existing values; empty strings clear them. Clearing a required credential disables the provider. Billing credentials are optional and used only for charge reconciliation; clear both together. Raw credentials are never returned.'
