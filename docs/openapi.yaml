        name: {type: string, maxLength: 120}
        enabled:
          type: boolean
          description: Enable or disable this provider for the account.
        api_key:
          type: string
          writeOnly: true
          description: Write-only provider secret; omitted keeps the saved value; an empty string clears it.
        base_url:
          type: string
