  "/v1/system/sales":
    get:
      tags: [System]
      summary: Read the complete sales hierarchy
      operationId: get__v1_system_sales
      description: Administrator browser session only. Includes all sales employees, including those reporting directly to Administrator or skipping a vacant rank. API keys are rejected.
      security: [{sessionAuth: []}]
      responses:
        '200':
          description: Consistent hierarchy snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesStructure'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  "/v1/system/sales/{employee}":
    put:
      tags: [System]
      summary: Add or move a sales employee and change their sales role
      operationId: put__v1_system_sales_employee
      description: >-
        Administrator browser session only. Requires the current global structure version.
        Supervisor must be a sales employee of strictly higher rank; empty means Administrator.
        Role and supervisor change atomically. Incompatible direct reports move to the selected
        supervisor, retaining their roles and clients. Other reports move with the employee.
        Existing personal client assignments survive sales-to-sales changes. Adding a non-sales
        user revokes their keys and is rejected for organization owners/managers and administrators.
        Changes are audited. API keys are rejected.
      security: [{sessionAuth: []}]
      parameters:
      - {in: path, name: employee, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, supervisor_id, version]
              properties:
                role: {$ref: '#/components/schemas/SalesRole'}
                supervisor_id: {type: string, description: Higher-rank employee UUID or empty for Administrator.}
                fill_vacancy: {type: boolean, default: false, description: "For lead/regional placement, atomically adopt lower-rank employees directly reporting to the selected supervisor. Cannot be combined with new_team. False preserves compatible direct reports."}
                new_team: {type: boolean, default: false, description: "For lead/regional placement, move only the employee into an empty branch; former direct reports stay with the previous supervisor or Administrator. Works with unchanged role/supervisor. Cannot be combined with fill_vacancy."}
                version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Saved hierarchy and its current version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SalesStructure'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Employee not found}
        '409': {description: Stale hierarchy or invalid role/supervisor placement}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/sales/bonuses:
    get:
      tags: [Organizations]
      summary: Read USD bonus balances for self and descendants
      operationId: get_sales_bonuses
      description: Browser sessions only. Administrators see all sales employees and former employees with ledger entries. Sales employees see themselves and current descendants. Balances include immutable accruals, corrections and recorded payouts; negative balances are allowed.
      security: [{sessionAuth: []}]
      responses:
        '200':
          description: Scoped balances and global rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  actor_id: {type: string, format: uuid}
                  administrator: {type: boolean}
                  settings: {$ref: '#/components/schemas/BonusSettings'}
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        email: {type: string}
                        role: {type: string}
                        accrued_usd: {type: number}
                        picture: {type: string, format: uri}
                        paid_usd: {type: number}
                        balance_usd: {type: number}
                        can_pay: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/sales/bonuses/{employee}/entries:
    get:
      tags: [Organizations]
      summary: Read immutable bonus history
      operationId: get_sales_bonus_entries
      security: [{sessionAuth: []}]
      parameters:
      - {in: path, name: employee, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: Up to 50 latest entries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/BonusEntry'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/sales/bonuses/{employee}/payouts:
    post:
      tags: [Organizations]
      summary: Record an already completed bonus payment
      operationId: post_sales_bonus_payout
      description: Browser administrator or ancestor with effective bonuses permission. Self-payments are forbidden. A positive amount is subtracted from the balance, which may become negative. This records a payment without sending money. The external ID makes retries idempotent per actor; changed content conflicts. Every payment is audited.
      security: [{sessionAuth: []}]
      parameters:
      - {in: path, name: employee, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_usd, paid_at, method, external_id]
              properties:
                amount_usd: {type: number, exclusiveMinimum: 0}
                paid_at: {type: string, format: date}
                method: {type: string, minLength: 1, maxLength: 200}
                reason: {type: string, maxLength: 1000}
                external_id: {type: string, format: uuid}
      responses:
        '200':
          description: Recorded or existing payment ID
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer, format: int64}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Same operation ID with different payment details}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/system/sales/bonus-settings:
    put:
      tags: [System]
      summary: Set global sales bonus percentages
      operationId: put_sales_bonus_settings
      description: Browser administrator only. Defaults are 5 percent for the assigned manager and 1 percent for their immediate actual supervisor. Sum cannot exceed 100 percent. Changes affect first recognition after saving; existing accruals keep their rate and recipients.
      security: [{sessionAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BonusSettings'}
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BonusSettings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale settings version}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/sales/permissions:
    get:
      tags: [Organizations]
      summary: Read effective sales permissions for self and team
      operationId: get_sales_permissions
      description: Browser sessions only. Administrators see all sales employees; sales employees see themselves and descendants. Includes the current shared hierarchy/permission version and grant issuer/time. No permissions are granted by default.
      security: [{sessionAuth: []}]
      responses:
        '200':
          description: Effective grants and scoped employee directory
          content:
            application/json:
              schema:
                type: object
                required: [version, actor_id, administrator, members, grants]
                properties:
                  version: {type: integer, minimum: 1}
                  actor_id: {type: string, format: uuid}
                  administrator: {type: boolean}
                  members: {type: array, items: {$ref: '#/components/schemas/SalesMember'}}
                  grants: {type: array, items: {$ref: '#/components/schemas/SalesGrant'}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/sales/permissions/{employee}/{permission}:
    put:
      tags: [Organizations]
      summary: Grant, replace or revoke a sales permission
      operationId: put_sales_permission
      description: Browser sessions only. An administrator may grant to any sales employee. A supervisor may grant only their own effective permissions to descendants. Any ancestor may revoke. Self-grants are forbidden. Replacing or revoking a grant permanently revokes its dependent delegations. A shared version prevents stale edits. All changes are audited.
      security: [{sessionAuth: []}]
      parameters:
      - {in: path, name: employee, required: true, schema: {type: string, format: uuid}}
      - {in: path, name: permission, required: true, schema: {type: string, enum: [pricing, models, topup, bonuses]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, version]
              properties:
                enabled: {type: boolean}
                version: {type: integer, minimum: 1}
      responses:
        '204': {description: Saved}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Permissions or hierarchy changed; reload before saving}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/organizations/{org}/sales-permissions:
    get:
      tags: [Organizations]
      summary: Read the caller's commercial permissions for this client
      operationId: get_organization_sales_permissions
      description: Browser session and current organization access required. Evaluates current grants and client assignment; does not grant membership or other organization rights.
      security: [{sessionAuth: []}]
      parameters:
      - {in: path, name: org, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Current commercial permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing: {type: boolean}
                  models: {type: boolean}
                  topup: {type: boolean}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/organizations/{org}/markups/catalog:
    get:
      tags: [Organizations]
      summary: Read the provider/model picker catalogue for company markup rules
      operationId: get_organization_markup_catalog
      description: Administrator or browser-session sales employee with pricing permission and access to this client. Does not expose provider credentials or allow global changes.
      security: [{sessionAuth: []}, {bearerAuth: []}]
      parameters:
      - {in: path, name: org, required: true, schema: {type: string, format: uuid}}
