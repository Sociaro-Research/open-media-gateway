                    "$ref": "#/components/schemas/Organization"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          description: Key or usage could not be read.
  "/v1/api-keys/usage":
    get:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags: [API keys]
      summary: Read monthly spending by API key
      description: >-
        Monthly spending statistics for account keys, including revoked keys. Financial limits belong to the organization and its members.
        consumed_usd includes only known completed gross generation costs;
        actual_usd includes only confirmed charges. Unknown legacy costs remain
        explicit. Tasks belong to their creation month in the requested timezone (UTC by default). Console session
        tasks have no API key attribution. Amounts use six decimal places.
      operationId: get_v1_api_keys_usage
      x-required-scope: keys:manage
      parameters:
      - name: month
        in: query
        description: Calendar month in the requested timezone, YYYY-MM (year 2000 or later). Defaults to the current month.
        schema:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        example: '2026-09'
      - {in: query, name: timezone, schema: {type: string, default: UTC}, description: IANA time zone for the calendar month. The console sends the user's local timezone.}
      responses:
        '200':
          description: Monthly estimates and coverage by key
          content:
            application/json:
              schema:
                type: object
                required: [data, month, currency]
                properties:
                  month:
                    type: string
                    example: '2026-09'
                  currency:
                    type: string
                    enum: [USD]
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/APIKeyMonthlyUsage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/api-keys":
    get:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags:
      - API keys
      summary: List account API keys
      description: Includes active, expired and revoked keys. Never includes secrets
        or hashes. Requires a browser session or a personal key with keys:manage. The
        deployment service key cannot manage personal keys.
      responses:
        '200':
          description: Account keys
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/APIKeyList"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: get_v1_api_keys
      x-required-scope: keys:manage
    post:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags:
      - API keys
      summary: Create a personal API key
      description: 'Create the first key using your browser session. Thereafter a key
        with keys:manage may create keys with a subset of its own permissions. Body
        limit: 4 KiB. The secret is shown once. This operation is not idempotent;
        after an ambiguous timeout, inspect the key list and revoke an unused key
        before issuing a replacement. The deployment service key cannot manage personal
        keys.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAPIKeyRequest"
            example:
              name: Production bot
              scopes:
              - generation
      responses:
        '429':
          description: Request quota exceeded; no task was accepted. Retry after the indicated number of seconds. Limits use rolling windows and aggregate all keys of the user within the workspace.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 1}
              description: Seconds until all exceeded quota windows allow another request
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        '201':
          description: Key created; save the secret now
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedAPIKey"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: post_v1_api_keys
      x-required-scope: keys:manage
  "/v1/api-keys/{id}":
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    delete:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags:
      - API keys
      summary: Revoke a personal API key
      description: Permanently blocks subsequent authentication. Repeating a revocation
        returns 204. Revocation does not cancel accepted tasks, revoke previously
        signed media URLs, or cascade to other keys created using this key. Requires
        a browser session or keys:manage. The deployment service key cannot manage
        personal keys.
      responses:
        '204':
          description: Revoked; empty response body
        '404':
          "$ref": "#/components/responses/NotFound"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
      operationId: delete_v1_api_keys_id
      x-required-scope: keys:manage
  "/auth/methods":
    get:
      tags: [Account]
      summary: Available browser sign-in methods
      operationId: get_auth_methods
      security: []
      responses:
        '200':
          description: Availability only; never exposes email credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required: {type: boolean, description: Fresh installation requires its one-time owner setup before ordinary sign-in. No setup code is exposed.}
                  google: {type: boolean}
                  email: {type: boolean, description: Email sign-in is enabled and supported; password login does not require email delivery.}
                  email_delivery: {type: boolean}
                  email_confirmation: {type: boolean, description: Email authentication is enabled and supported; existing verification grants do not require current delivery availability.}
  "/auth/setup":
    post:
      tags: [Account]
      summary: Create the first installation owner and browser session
      operationId: post_auth_setup
      security: []
      description: >-
        JSON-only, cross-origin-protected initial setup. Requires the installation
        code obtained through trusted gateway admin setup-code. Only a fresh
        installation without users can be claimed. User, Administrator role,
        password, session and consumed setup code commit atomically. Email
        delivery is not required. Upgrades with existing users keep setup closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, email, password]
              properties:
                code: {type: string, minLength: 43, maxLength: 43, writeOnly: true}
                name: {type: string, minLength: 1, maxLength: 100}
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 15, maxLength: 128, writeOnly: true}
      responses:
        '201':
          description: Owner created and signed in through a Secure HttpOnly SameSite=Lax session cookie on HTTPS.
          content:
            application/json:
              schema: {type: object, properties: {message: {type: string}}}
        '400': {description: Invalid setup fields}
        '403': {description: Invalid code or cross-origin request}
        '409': {description: Initial setup unavailable or already completed}
        '415': {description: JSON content type required}
        '429': {description: Too many setup attempts}
        '503': {description: Setup temporarily unavailable}
  "/auth/email/{action}":
    post:
      tags: [Account]
      summary: Register, verify, sign in or recover an email account
      operationId: post_auth_email
      security: []
      description: >-
        JSON-only browser endpoint protected against cross-origin mutations.
        Register and forgot take email and optionally invitation_token. Both return a generic 202
        and require configured email delivery. Verify exchanges its one-time token
        for a restricted HttpOnly registration cookie. Registration checks that
        cookie; complete sets a 15–128 character password and creates the account
        and normal session. Reset takes its one-time token and a new password.
        Verification expires in 1 hour; registration grants and reset in 30 minutes.
        Login takes email and password and sets an HttpOnly session cookie.
        Reset invalidates browser sessions and reset links, but not API keys.
        Email verification/reset tokens are delivered in URL fragments, submitted in JSON
        and never returned by this API. The optional invitation_token is encrypted
        in the challenge and restored only after proof of mailbox ownership through
        verify, registration, complete or reset responses. Registration grants cannot
        be substituted by JSON tokens. Invitation acceptance remains a separate authenticated action.
        Email-only registrations do not gain organization membership.
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [register, login, forgot, verify, registration, complete, reset]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, format: password, maxLength: 128}
                token: {type: string, minLength: 43, maxLength: 43}
                invitation_token: {type: string, minLength: 43, maxLength: 43, description: "Optional organization invitation capability, accepted only by register/forgot. Restored after email ownership is verified; never accepted automatically."}
      responses:
        '200':
          description: Verified, reset or signed in. Verification/reset also returns the email.
        '202':
          description: Generic registration or recovery response; does not reveal account existence.
        '400':
          description: Invalid input, expired or already used link.
        '401':
          description: Incorrect email or password, or unverified address.
        '403':
          description: Cross-origin request rejected.
        '415':
          description: JSON content type required.
        '429':
          description: Too many attempts; Retry-After header supplied.
        '503':
          description: Delivery not configured, delivery failed, or authentication temporarily unavailable.
  "/auth/google":
    get:
      tags:
      - Account
      summary: Start Google sign-in
      description: Browser redirect to Google. Used to establish a console session
        and bootstrap the first key; no key required. Only registered when Google
        OAuth is configured.
      security: []
      responses:
        '302':
          description: Browser redirect
        '503':
          description: Authentication unavailable
      operationId: get_auth_google
  "/auth/google/callback":
    get:
      tags:
      - Account
      summary: Complete Google sign-in
      description: Browser callback with a one-time code and state. Validates identity,
        establishes an HttpOnly session and redirects to UI_PUBLIC_URL/. Only registered when Google
        OAuth is configured.
      security: []
      responses:
        '302':
          description: Browser redirect
        '503':
