components:
  securitySchemes:
    paymentIntegrationAuth:
      type: http
      scheme: bearer
      description: Dedicated pay_ token scoped to one trusted payment integration.
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal Gateway key (gw_…), or the separate deployment service
        key. An explicit key takes precedence over a browser session. Only Authorization Bearer is accepted.
    sessionAuth:
      type: apiKey
      in: cookie
      name: media_gateway_session
      description: HttpOnly browser session for account, provider, storage and API-key administration only. Generation, catalog, task and reference endpoints require an API key, including in the console.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        maxLength: 200
      description: Optional, at most 200 bytes. Scoped to the account across all its
        keys. Same key and normalized request returns the original task (202); different
        content returns 409. Use a new value for each intended generation; reuse it
        on uncertain network retries. Applies only to generation endpoints.
    TaskID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ProviderID:
      in: path
      name: providerId
      required: true
      schema:
        type: string
        description: Connection ID returned by the administrative provider list.
  responses:
    BadRequest:
      description: Invalid request or provider configuration
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Gateway API key
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rolling request quota exceeded or local upload admission busy. Honor Retry-After in seconds.
      headers:
        Retry-After:
          description: Minimum seconds to wait before retrying.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A dependency prevented the operation
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient key permissions, personal account required, or cross-origin
        browser mutation rejected.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  schemas:
    LegalDocument:
      type: object
      additionalProperties: false
      required: [text, version]
      properties:
        text: {type: string, maxLength: 65536, description: 'Plain UTF-8 text, at most 64 KiB in bytes. Empty text restores the bundled template. HTML is displayed literally.'}
        version: {type: integer, minimum: 1, description: Optimistic concurrency token; not a legal agreement version or acceptance record.}
    SiteBranding:
      type: object
      additionalProperties: false
      required: [name, description, contact_email, dark, light, assets, version]
      properties:
        name: {type: string, maxLength: 80, description: Empty when unconfigured; otherwise maximum 80 UTF-8 bytes without control characters}
        description: {type: string, maxLength: 240, description: Maximum 240 UTF-8 bytes without control characters}
        contact_email:
          description: Empty when unconfigured; otherwise a valid contact email address.
          anyOf:
            - {type: string, format: email, maxLength: 254}
            - {type: string, maxLength: 0}
        site_max_width: {type: integer, nullable: true, minimum: 960, maximum: 7680, default: 1280, description: Desktop site maximum in CSS pixels. Null removes the width limit while retaining safe outer gutters. Missing legacy values retain 1280.}
        content_max_width: {type: integer, nullable: true, minimum: 640, maximum: 7680, description: Desktop content maximum in CSS pixels. Null uses all available content space.}
        sidebar_subsections: {type: boolean, default: false, description: Expand navigation subsections in the left menu on desktop. Mobile retains horizontal tabs.}
        dark: {$ref: '#/components/schemas/BrandPalette'}
        light: {$ref: '#/components/schemas/BrandPalette'}
        presets:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: '#/components/schemas/ColorPreset'}
          description: Administrator-managed named pairs of dark and light palettes. Legacy writes without this field preserve the catalog and edit its default pair.
        default_preset: {type: string, maxLength: 64, description: Existing color theme used on public surfaces and by users who follow the site default. The dark/light fields mirror this preset.}
        version: {type: integer, minimum: 1}
        assets:
          type: object
          description: Dark slots use logo, symbol and favicon; corresponding light slots have _light suffix. Slots inherit from the other theme when empty. touch_icon and email_logo are shared.
          additionalProperties: false
          properties:
            logo: {$ref: '#/components/schemas/BrandAsset'}
            logo_light: {$ref: '#/components/schemas/BrandAsset'}
            symbol: {$ref: '#/components/schemas/BrandAsset'}
            symbol_light: {$ref: '#/components/schemas/BrandAsset'}
            favicon: {$ref: '#/components/schemas/BrandAsset'}
            favicon_light: {$ref: '#/components/schemas/BrandAsset'}
            touch_icon: {$ref: '#/components/schemas/BrandAsset'}
            email_logo: {$ref: '#/components/schemas/BrandAsset'}

    ColorPreset:
      type: object
      additionalProperties: false
      required: [id, name, dark, light]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$'}
        name: {type: string, minLength: 1, maxLength: 80, description: Unique case-insensitive name without surrounding whitespace or control characters.}
        dark: {$ref: '#/components/schemas/BrandPalette'}
        light: {$ref: '#/components/schemas/BrandPalette'}

    BrandAsset:
      type: object
      additionalProperties: false
      required: [mime, data]
      properties:
        mime: {type: string, enum: [image/png, image/jpeg, image/svg+xml]}
        data: {type: string, format: byte, description: Base64-encoded image bytes up to 512 KiB decoded}
    BrandPalette:
      type: object
      additionalProperties: false
      required: [accent, accent-dark, highlight, on-accent, on-highlight, bg, panel, panel-2, field, popup, line, switch-off, text, muted, blue, red, success, yellow, on-warning, chart-2, chart-3, chart-4, chart-5, chart-6]
      properties:
        accent: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        accent-text: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Accent foreground text and selection/focus edges; inherits accent in legacy palettes.}
        chart-1: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Primary chart series; inherits accent in legacy palettes.}
        switch-thumb: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Off switch thumb; inherits on-accent in legacy palettes.}
        switch-thumb-on: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: On switch thumb; inherits on-accent in legacy palettes.}
        switch-on-border: {type: string, pattern: '^#[0-9a-fA-F]{6}$', description: On switch edge; inherits accent in legacy palettes.}
        accent-dark: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        highlight: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        on-accent: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        on-highlight: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        bg: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        panel: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        panel-2: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        field: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        popup: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        line: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        switch-off: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        text: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        muted: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        blue: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        red: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        success: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        yellow: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        on-warning: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        chart-2: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        chart-3: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        chart-4: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        chart-5: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
        chart-6: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}

    BonusSettings:
      type: object
      additionalProperties: false
      required: [manager_percent, supervisor_percent, version]
      properties:
        manager_percent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01, default: 5}
        supervisor_percent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01, default: 1}
        version: {type: integer, minimum: 1}
        starts_at: {type: string, format: date-time, readOnly: true, description: Only requests accepted after activation participate.}
    BonusEntry:
      type: object
      properties:
        id: {type: integer, format: int64}
        employee_id: {type: string, format: uuid}
        task_id: {type: string, format: uuid}
        kind: {type: string, enum: [accrual, correction, payout]}
        beneficiary: {type: string, enum: [manager, supervisor]}
        amount_usd: {type: number, description: Signed ledger amount; payouts are negative.}
        created_at: {type: string, format: date-time}
        paid_at: {type: string, format: date}
        method: {type: string}
        reason: {type: string}
        actor_name: {type: string}
        actor_id: {type: string}
        actor_picture: {type: string, format: uri}
    ReportMetrics:
      type: object
      required: [requests, successful, failed, spend_usd, priced_requests, tokens, token_requests]
      properties:
        profit_usd: {type: number, description: Administrator or scoped sales viewer only. Recognized customer spending minus provider cost; excludes deposits, historical requests and personal/BYOK requests.}
        recognized_profit_requests: {type: integer}
        pending_profit_requests: {type: integer, description: Requests awaiting billing verification or known costs.}
        requests: {type: integer}
        successful: {type: integer}
        failed: {type: integer}
        spend_usd: {type: number, description: Sum of known customer charges including markup; same amounts as report rows.}
        priced_requests: {type: integer, description: Requests with known charge values.}
        tokens: {type: number, description: Reported total tokens; input/output counters are not added again when a total exists.}
        token_requests: {type: integer, description: Requests that reported token counters; missing counters are not treated as zero.}
    ReportGroup:
      allOf:
      - $ref: '#/components/schemas/ReportMetrics'
      - type: object
        properties:
          name: {type: string}
          provider: {type: string}
    ReportDetail:
      type: object
      required: [report, generation, content_access, request_logging]
      properties:
        report: {type: object, additionalProperties: true, description: Authorized cost report row with user and key labels. Administrator and scoped sales viewers additionally receive profit_usd, profit_status (generating, awaiting_billing, awaiting_cost, recognized, not_tracked, not_applicable), and profit_recognized_at.}
        generation: {type: object, additionalProperties: true, description: Existing public generation representation restricted by viewer role}
        content_access: {type: boolean}
        request_logging: {type: string, enum: [full, minimized]}
        request:
          type: object
          description: Content roles only. Minimal logging exposes only retained technical options.
          properties:
            prompt: {type: string}
            options: {type: object, additionalProperties: true}
            webhook_url: {type: [string, 'null']}
        processing: {type: object, additionalProperties: true, description: Retained worker start, polling errors and original image-input flag; content roles only}
        links:
          type: object
          description: Report-scoped authenticated links for existing result files; content roles only
          properties:
            content_url: {type: string}
            download_url: {type: string}
            last_frame_url: {type: string}
    ReportSummary:
      allOf:
      - $ref: '#/components/schemas/ReportMetrics'
      - type: object
        properties:
          average_cost_usd: {type: [number, 'null'], description: Average over requests with known costs.}
          interval: {type: string, enum: [day, week, month]}
          periods:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/ReportMetrics'
              - type: object
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
          public_models: {type: array, items: {$ref: '#/components/schemas/ReportGroup'}, description: Historical public model names sorted by spend descending.}
          provider_models: {type: array, items: {$ref: '#/components/schemas/ReportGroup'}}
          providers: {type: array, items: {$ref: '#/components/schemas/ReportGroup'}}
    LoginProvider:
      type: object
      required: [provider, name, enabled, connected, configured, secret_configured, version]
      properties:
        provider: {type: string, enum: [google, email]}
        name: {type: string}
        enabled: {type: boolean}
        connected: {type: boolean}
        configured: {type: boolean}
        client_id: {type: string}
        secret_configured: {type: boolean}
        redirect_url: {type: string, format: uri, description: Read-only callback derived from the trusted public origin}
        version: {type: integer, minimum: 1}
    ModelSetting:
      type: object
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        model: {type: string, description: Native provider model ID}
        name: {type: string}
        public_id: {type: string, description: Exact model value used in generation requests}
        enabled_by_default: {type: boolean}
        granted: {type: boolean, description: Explicit grant for the organization being read}
        provider_name: {type: string, description: Provider display name in administrative catalog responses}
        provider_icon_url: {type: string, description: Content-versioned provider artwork URL for administrative model pickers}
        provider_icon_monochrome: {type: boolean, description: Whether the provider artwork should follow the active theme}
        capabilities: {$ref: '#/components/schemas/MediaModel'}
        version: {type: integer}
    OrganizationModelAccess:
      type: object
      additionalProperties: false
      required: [model_ids, version]
      properties:
        model_ids: {type: array, uniqueItems: true, maxItems: 10000, items: {type: string, format: uuid}}
        version: {type: integer, minimum: 1}

    PaymentSettlement:
      type: object
      additionalProperties: false
      required: [currency, amount_minor, fee_minor, decimal_places]
      description: Actual provider settlement amounts, not the cardholder bank debit. Divide minor-unit amounts by 10 to the power of decimal_places. Omitted until authoritative settlement data is available.
      properties:
        currency: {type: string, pattern: '^[a-z]{3}$'}
        amount_minor: {type: integer, minimum: 1}
        fee_minor: {type: integer, minimum: 0}
        decimal_places: {type: integer, minimum: 0, maximum: 3}
    BalanceEntry:
      type: object
      additionalProperties: false
      required: [id, created_at, amount_usd, kind, reason, provider]
      properties:
        id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        amount_usd: {type: number, description: Signed balance change for this entry; zero for attempts without a credit}
        kind: {type: string, enum: [payment, promo, adjustment, attempt]}
        reason: {type: string}
        provider: {type: string}
        payment:
          $ref: '#/components/schemas/Payment'
    PaymentBilling:
      type: object
      description: Verified purchase basis and customer billing details. Tax is paid by the customer and never credited to their balance. Refund and hold amounts here include tax; payment-level refunded_cents and held_cents are principal reductions.
      properties:
        subtotal_cents: {type: integer, minimum: 100}
        tax_cents: {type: integer, minimum: 0}
        total_cents: {type: integer, minimum: 100}
        refunded_cents: {type: integer, minimum: 0}
        held_cents: {type: integer, minimum: 0}
        business_name: {type: string}
        email: {type: string}
        address:
          type: object
          properties:
            line1: {type: string}
            line2: {type: string}
            city: {type: string}
            state: {type: string}
            postal_code: {type: string}
            country: {type: string}
        tax_ids:
          type: array
          items:
            type: object
            properties:
              type: {type: string}
              value: {type: string}
    PaymentInvoice:
      type: object
      description: Native Stripe invoice or a locally issued immutable PDF. Native documents may remain pending after settlement; local documents are generated on request.
      properties:
        id: {type: string}
        number: {type: string}
        status: {type: string, enum: [pending, paid, issued]}
        url: {type: string, format: uri}
        pdf_url: {type: string, format: uri}
    StablecoinBillingProfile:
      type: object
      additionalProperties: false
      required: [business_name, address]
      properties:
        business_name: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, maxLength: 300}
        address:
          $ref: '#/components/schemas/PaymentBilling/properties/address'
        tax_ids:
          $ref: '#/components/schemas/PaymentBilling/properties/tax_ids'
    PaymentSellerCompany:
      type: object
      additionalProperties: false
      properties:
        legal_name: {type: string, minLength: 1, maxLength: 200}
        email: {type: string, maxLength: 254}
        invoice_logo:
          type: object
          nullable: true
          additionalProperties: false
          required: [mime, data]
          description: Separate invoice logo. PNG or JPEG up to 512 KiB and 4 megapixels, max 4096 pixels per side. Re-encoded as PNG on save. Null removes it.
          properties:
            mime: {type: string, enum: [image/png, image/jpeg]}
            data: {type: string, format: byte}
        address:
          $ref: '#/components/schemas/PaymentBilling/properties/address'
        registration_number: {type: string, maxLength: 300}
        vat_registered: {type: boolean}
        vat_number:
          type: string
          maxLength: 300
          description: Seller VAT number. When VAT registered, 3–40 letters/digits including at least one digit; spaces are removed and letters uppercased on save. Invalid format returns invalid_seller_vat_number. The console derives VAT registration from a nonempty number; this does not verify registration with a tax authority.
        oss_registered: {type: boolean}
    PaymentVATRule:
      type: object
      additionalProperties: false
      required: [country, status, treatment, rate_percent]
      properties:
        country: {type: string, description: ISO country code or domestic/EU/non_eu/*}
        status: {type: string, enum: [any, registered, unregistered]}
        treatment: {type: string, enum: [standard, reverse_charge, exempt, outside_scope]}
        rate_percent: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01}
    PaymentVATSettings:
      type: object
      additionalProperties: false
      required: [version, seller, rules]
      properties:
        version: {type: integer, minimum: 1}
        seller:
          $ref: '#/components/schemas/PaymentSellerCompany'
        rules:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/PaymentVATRule'}
    PaymentVATVerification:
      type: object
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 0}
        verified: {type: boolean}
        country: {type: string}
        number: {type: string}
        business_name: {type: string}
        source: {type: string, enum: ['', manual, vies], readOnly: true}
        reference: {type: string, maxLength: 1000}
