        shared_storage_limit_bytes: {type: [integer, 'null'], description: Set through /v1/system/storage/quota; preserved by ordinary settings updates.}
        shared_resources: {type: boolean, default: false, description: "Enable shared providers and storage. Disabling blocks new shared work; accepted tasks and existing files remain available."}
        generation_ui: {type: boolean, description: "Show the Generation screen; does not disable API generation."}
        allow_inline_references: {type: boolean, default: true, description: "Allow reference contents in provider requests. When false, HTTP(S) URLs and model-supported asset:// references are accepted and library images are not inlined. Applies at admission and dispatch to shared and personal connections. Omission on update preserves the current value."}
        personal_providers: {type: boolean, description: "Let non-administrators manage personal provider connections. Personal keys cannot start new generations while this is disabled; saved connections and history are preserved."}
        version: {type: integer, minimum: 1, description: "Send the current version when updating settings."}
