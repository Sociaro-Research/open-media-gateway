  /v1/organizations/{id}/request-logging:
    parameters:
    - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    put:
      tags: [Organizations]
      operationId: updateOrganizationRequestLogging
      summary: Set request logging for new organization generations
      description: Managers can minimize retained request content. New tasks inherit this setting when accepted. After a minimized task finishes, its prompt, instructions, input references, raw provider usage and webhook destination are removed; status, normalized usage and cost remain. In-flight tasks and existing task records keep the policy they had when accepted.
      x-required-scope: organizations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minimize_request_logging]
              properties:
                minimize_request_logging: {type: boolean}
      responses:
        '204': {description: Request logging setting saved}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/organizations/{id}/storage:
    parameters:
    - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Organizations]
      operationId: getOrganizationStorage
      summary: Read organization storage settings
      description: Managers can read settings. Administrators without manager membership can only read the selected driver. Secrets are never returned. The default is Gateway storage. API keys need organizations:manage.
      x-required-scope: organizations:manage
      responses:
        '200':
          description: Selected storage and free Gateway allowance
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: {$ref: '#/components/schemas/StorageSettings'}
                  can_manage: {type: boolean, description: 'True only for managers. Administrators without this membership receive only the selected storage driver.'}
                  gateway_allowance_bytes: {type: integer, nullable: true, description: 'Per-organization Gateway allowance in bytes; null means unlimited.'}
    put:
      tags: [Organizations]
      operationId: updateOrganizationStorage
      summary: Select Gateway storage or organization S3
      description: Managers only, including administrators who also hold this membership. Use driver gateway or s3. S3 object access and browser preflights are tested before saving. Missing CORS is configured for UI_PUBLIC_URL (or API_PUBLIC_URL, then request Origin), preserving existing rules and bucket privacy. Missing CORS requires read/update rights; browser_uploads_pending indicates a confirmed policy still propagating. Keys using shared providers use this selection for new uploads and generations, using organization storage ownership. Keys using personal providers use the user’s personal storage. Existing files are not moved or deleted and retain their original connection. Blank credentials preserve the saved credentials; changing endpoints requires both credentials again.
      x-required-scope: organizations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageUpdate'}
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageSettings'}
  /v1/organizations/{id}/storage/check:
    parameters:
    - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Organizations]
      operationId: checkOrganizationStorage
      summary: Test organization S3 without saving
      description: Managers only, including administrators who also hold this membership. Verifies write, read and delete access using a temporary object and checks PUT/GET/HEAD browser preflights for the configured frontend origin (falling back to the request Origin). Missing browser access returns storage_browser_setup_required. Does not switch storage or change CORS.
      x-required-scope: organizations:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StorageUpdate'}
      responses:
        '200': {description: Connection verified}
  "/v1/client-onboardings":
    get:
      tags: [Organizations]
      operationId: get_client_onboardings
      summary: List companies onboarded by the current client manager
      security: [{sessionAuth: []}]
      description: Browser only. Lists up to 100 recent cards currently in the manager's provisional or activated portfolio. Does not grant organization membership or statistics access before acceptance.
      responses:
        '200':
          description: Scoped cards with invitation delivery status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ClientOnboarding'}
        '403': {description: Not a client manager or explicit API credential}
    post:
      tags: [Organizations]
      operationId: create_client_onboarding
      summary: Create a company and email its first owner invitation
      security: [{sessionAuth: []}]
      description: Browser only. Atomically saves the company, provisional manager, recipient-bound 14-day Supermanager invitation and durable email delivery. Reuse operation_id and identical normalized input after an uncertain response. Creation success does not confirm email delivery. No user, password, credit, key or customer membership is created here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, name, domain, country, contact_name, email]
              properties:
                operation_id: {type: string, format: uuid}
                name: {type: string, minLength: 1, maxLength: 160}
                country: {type: string, minLength: 1, maxLength: 100}
                contact_name: {type: string, minLength: 1, maxLength: 160}
                email: {type: string, format: email, maxLength: 254}
                domain: {type: string, minLength: 1, maxLength: 2048, description: Required company website or domain; normalized to hostname without www, scheme, port or path. Internationalized hostnames use ASCII IDNA.}
                comment: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Committed company or idempotent replay, including current delivery status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientOnboarding'}
        '400': {description: Invalid fields}
        '403': {description: Not a client manager or explicit API credential}
        '409': {description: Reused operation with different input, or duplicate normalized name or website. Duplicate error includes criterion and manager; organization ID appears only within the caller's scope.}
        '429': {description: 20 distinct companies changed within the rolling last hour}
  "/v1/client-onboardings/{org}/{action}":
    post:
      tags: [Organizations]
      operationId: change_first_owner_invitation
      summary: Resend or revoke an unaccepted first-owner invitation
      security: [{sessionAuth: []}]
      description: Browser only, live provisional manager only. Reuse operation_id on uncertain retries. Version conflicts return 409. Resend preserves the company and invitation IDs, renews the 14-day expiry and rotates the link after successful delivery; revoked links stay invalid. Acceptance stops resend/revoke. Background delivery does not count toward the manual quota.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string, enum: [resend, revoke]}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, version]
              properties:
                operation_id: {type: string, format: uuid}
                version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Current card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientOnboarding'}
        '403': {description: Outside current scope}
        '409': {description: Version conflict, operation mismatch or invitation already accepted}
        '429': {description: Manual distinct-company limit reached}
