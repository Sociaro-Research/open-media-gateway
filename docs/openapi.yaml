      name: owner
      required: true
      schema: {type: string, format: uuid}
    - in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    - in: query
      name: signature
      required: true
      schema: {type: string}
    get:
      operationId: get_references_owner_id
      tags: [References]
      summary: Fetch a reference file using its capability URL
      description: Use the URL returned by the library API; do not construct signatures. Possession grants read access until file deletion or MEDIA_URL_SIGNING_SECRET rotation. No session or bucket credentials are required. Supports HTTP ranges. Convert the relative URL to an absolute URL against this Gateway's public origin before passing it in image or input_reference.
      security: []
      responses:
        '307':
          description: S3 file; follow the signed storage URL without forwarding Gateway credentials. S3 serves file bytes and Range requests directly.
          headers:
            Location: {schema: {type: string, format: uri}}
        '200':
          description: Image bytes
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
        '206': {description: Requested byte range}
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    head:
      operationId: head_references_owner_id
      tags: [References]
      summary: Inspect reference file headers
      security: []
      responses:
        '307':
          description: S3 file; follow the signed storage URL without forwarding Gateway credentials. S3 serves file bytes and Range requests directly.
          headers:
            Location: {schema: {type: string, format: uri}}
        '200': {description: Image headers without a response body}
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
