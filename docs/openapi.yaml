  "/v1/organizations/{org}/payments/{id}/refresh":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_organizations_org_payments_id_refresh"
      "summary": "Reconcile a payment with Stripe"
      "description": "Fetches current provider state under a payment lock. May return 503 while actual processing fees are not yet available. Safe to retry. Refunds and disputes can reduce available balance below zero."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Payment"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "org"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/v1/payments/webhooks/{id}":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_payments_webhooks_id"
      "summary": "Receive signed Stripe events"
      "description": "Raw request body, maximum 256 KiB. Verify Stripe-Signature HMAC with a five-minute tolerance. Test/live and merchant identity must match. Events trigger authoritative reconciliation rather than incremental credits. Disabled Stripe providers continue settling existing payments."
      "responses":
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
        "204":
          "description": "Verified and processed or safely ignored"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Stripe-Signature"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
      "security": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
  "/v1/payment-integrations/{id}/settlements":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_payment_integrations_id_settlements"
      "summary": "Settle an externally confirmed payment"
      "description": "Only the dedicated pay_ token issued for this integration is accepted; sessions, Gateway API keys and Stripe keys cannot grant credits. The external ID is globally unique within the integration, with immutable organization and amount. Send cumulative fee/refund/hold totals and monotonically increasing revisions. An identical revision is a no-op; stale or conflicting revisions return 409. The ledger and payment state commit atomically. Test integrations never add spendable funds."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Payment"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ExternalPaymentSettlement"
      "security":
        -
          "paymentIntegrationAuth": []
