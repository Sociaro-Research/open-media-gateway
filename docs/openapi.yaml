  "/v1/system/storage":
    get:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags: [System]
      operationId: get_v1_system_storage
      summary: Shared — Read account storage settings
      description: Returns the current local or S3 selection, connection fields and access key ID to authorized storage managers. The secret access key is never returned. Accounts default to local storage.
      x-system-administrator-required: true
      x-required-scope: system:manage
      responses:
        '200':
          description: Storage settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StorageSettings"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    put:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags: [System]
      operationId: put_v1_system_storage
      summary: Shared — Configure account storage
      description: Tests S3 object write, read and delete permissions before activating. Checks browser preflights for configured UI_PUBLIC_URL (or API_PUBLIC_URL), falling back to the request Origin. Missing CORS is configured automatically using the saved key, preserving other rules and bucket privacy; CORS read/update rights are required only for missing browser access. After confirming the saved policy, browser_uploads_pending can be true while provider caches apply the change. Changes apply when results are archived, without restarting the worker. Existing files remain at their original location. Blank credentials preserve saved values; changing endpoint requires both credentials again. Selecting local preserves the last S3 connection. Maximum request body is 16 KiB.
      x-system-administrator-required: true
      x-required-scope: system:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StorageUpdate"
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StorageSettings"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/system/storage/check":
    post:
      security:
      - bearerAuth: []
      - sessionAuth: []
      tags: [System]
      operationId: post_v1_system_storage_check
      summary: Shared — Test proposed storage settings without saving
      description: Creates, reads and deletes a uniquely named temporary object under the configured prefix. Does not list or create buckets. Uses saved credentials if omitted. A successful check does not activate the settings. Also validates PUT/GET/HEAD browser preflights for configured UI_PUBLIC_URL (or API_PUBLIC_URL), falling back to the request Origin. Without either, retains the server-only probe. Missing browser access returns storage_browser_setup_required. No bucket CORS is changed.
      x-system-administrator-required: true
      x-required-scope: system:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StorageUpdate"
      responses:
        '200':
          description: Connection verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/v1/system/reports":
    get:
      tags: [System]
      summary: Read generation cost history across all organizations
      operationId: get_v1_system_reports
      x-system-administrator-required: true
      x-required-scope: system:manage
      security:
      - bearerAuth: []
      - sessionAuth: []
      description: Administrator financial history across all organizations and provider modes, including revoked keys. Reports distinguish expected_usd (estimate), metered_usd (reported consumption), and tariff_usd (bill-confirmed gross price). actual_usd is the separate cash payment. Generation cost consumes organization balance and member weekly allowance regardless of package coverage. Provider charge and package units remain separate. No charge is inferred when billing data is absent.
      parameters:
      - {in: query, name: view, schema: {type: string, enum: [summary]}, description: Aggregate all matching requests; ignores pagination. Cannot combine with CSV.}
      - {in: query, name: interval, schema: {type: string, enum: [day, week, month], default: day}, description: "Summary calendar buckets in the selected timezone. Weeks start Monday. A range of one month or less has one monthly bucket. Maximum 10000 buckets."}
      - {in: query, name: user, schema: {type: string}, description: Exact user ID or email (case-insensitive); financial viewers only.}
      - {in: query, name: timezone, schema: {type: string, default: UTC}, description: IANA time zone for inclusive from/to calendar dates; CSV timestamps remain UTC.}
      - {in: query, name: format, schema: {type: string, enum: [csv]}, description: Export every matching row as CSV; limit and offset are ignored.}
      - {in: query, name: user_id, schema: {type: string, format: uuid}}
      - {in: query, name: from, description: "First included date in the requested timezone; defaults to the start of this month.", schema: {type: string, format: date}}
      - {in: query, name: to, description: "Last included date in the requested timezone; defaults to today.", schema: {type: string, format: date}}
      - {in: query, name: api_key_id, schema: {type: string, format: uuid}}
      - {in: query, name: generation_id, schema: {type: string, format: uuid}, description: Exact generation ID. Combined with the other filters.}
      - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      - {in: query, name: offset, schema: {type: integer, minimum: 0, maximum: 100000, default: 0}}
      responses:
        '200':
          description: Tasks in descending creation order.
          content:
            text/csv:
              schema: {type: string}
              example: "Created at (UTC),Cost (USD)"
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ReportSummary'
                -
                    type: object
                    properties:
                      has_more: {type: boolean}
                      next_offset: {type: integer}
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id: {type: string, format: uuid}
                            user_email: {type: string}
                            user_picture: {type: string, format: uri, description: Current profile image for the authorized report user; historical identity labels remain unchanged.}
                            organization_id: {type: string, format: uuid}
                            organization_name: {type: string}
                            id: {type: string, format: uuid}
                            created_at: {type: string, format: date-time}
                            api_key_id: {type: [string, 'null']}
                            api_key_name: {type: string}
                            identity_historical: {type: boolean, description: True when labels were captured at request acceptance. False for legacy current-directory fallbacks.}
                            identity_snapshot: {type: object, additionalProperties: true}
                            provider_name: {type: string}
                            model: {type: string}
                            provider: {type: string}
                            status: {type: string}
                            usage:
                              "$ref": "#/components/schemas/ProviderUsage"
                            consumed_usd: {type: [number, 'null'], description: "Generation cost before package coverage; null while unknown."}
                            cost:
                              "$ref": "#/components/schemas/TaskCost"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"

  "/v1/system/resources/import":
    post:
      tags: [System]
      summary: Copy your personal connections to shared resources
      operationId: post_v1_system_resources_import
      description: Requires an administrator. Copies the caller's saved encrypted provider and S3 connections into empty shared settings. Does not overwrite existing shared connections, migrate files or enable sharing. Audited.
      x-required-scope: system:manage
      security: [{bearerAuth: []}, {sessionAuth: []}]
      responses:
        '204': {description: Connections copied}
        '403': {description: Administrator required}
  /v1/system/login-providers:
    get:
      operationId: get_v1_system_login_providers
      tags: [System]
      summary: List login providers and available methods
      x-required-scope: system:manage
      security: [{bearerAuth: []}, {sessionAuth: []}]
      responses:
