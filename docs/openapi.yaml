          description: Provider cards, supported methods and email delivery readiness; secrets are never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/LoginProvider'}}
                  available_providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                  email_delivery_configured: {type: boolean}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/system/login-providers/{provider}:
    parameters:
      - in: path
        name: provider
        required: true
        schema: {type: string, enum: [google, email]}
    put:
      operationId: put_v1_system_login_providers_provider
      tags: [System]
      summary: Configure or enable a login provider
      description: Administrator only. Updates apply to new authentication attempts immediately; existing users and sessions are preserved. Google credentials are encrypted. An omitted Client Secret preserves the saved secret. Email needs configured delivery to appear on the login screen. Each provider has an independent version.
      x-required-scope: system:manage
      security: [{bearerAuth: []}, {sessionAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, version]
              properties:
                enabled: {type: boolean}
                version: {type: integer, minimum: 1}
                client_id: {type: string, maxLength: 512, description: Google web OAuth Client ID}
                client_secret: {type: string, maxLength: 512, writeOnly: true, description: Google OAuth secret; omitted or empty preserves the saved value}
      responses:
        '200':
          description: Saved provider without its secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginProvider'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Settings changed; reload before saving}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  "/v1/system/email":
    get:
      tags: [System]
      summary: Read email delivery provider settings
      operationId: get_v1_system_email
      x-required-scope: system:manage
      security: [{bearerAuth: []}, {apiKeyAuth: []}, {sessionAuth: []}]
      description: Requires a current administrator. Returns available mail providers and saved sender settings; never returns the API key or its ciphertext.
      responses:
        '200':
          description: Email delivery settings
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/EmailDeliverySettings"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
    put:
      tags: [System]
      summary: Configure or remove an email delivery provider
      operationId: put_v1_system_email
      x-required-scope: system:manage
      security: [{bearerAuth: []}, {apiKeyAuth: []}, {sessionAuth: []}]
      description: >-
        Requires a current system administrator. Resend requires an API key and
        a sender address on a verified domain. An omitted or empty api_key keeps
        the saved key. An empty provider removes the connection and key. Changes
        apply immediately without restart. Saving validates the input format;
        it does not send a test email or verify the key with Resend. Audited
        without secrets. Version prevents overwriting another administrator's edit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, from, version]
              properties:
                provider: {type: string, enum: ['', resend]}
                from: {type: string, maxLength: 320, example: 'Sociaro <login@example.com>'}
                api_key: {type: string, maxLength: 512, writeOnly: true}
                version: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/EmailDeliverySettings"}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
        '403': {"$ref": "#/components/responses/Forbidden"}
        '409': {description: Settings changed; reload before saving}
        '503': {"$ref": "#/components/responses/ServiceUnavailable"}
  "/v1/system/limits":
    get:
      tags: [System]
      summary: Read system request limits
      operationId: get_system_limits
      x-required-scope: system:manage
      description: Administrators only. Positive integer quotas; null organization values inherit the corresponding system default. User counters combine all keys within the same organization; personal keys use a separate counter. Changes apply to subsequent requests, without resetting usage counters. Version guards concurrent edits. Accepted generations continue even if limits are lowered.
      security:
      - bearerAuth: []
      - sessionAuth: []
      responses:
        '200':
          description: System defaults, organization overrides and effective values
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/RequestLimitPolicy"}
        '400': {"$ref": "#/components/responses/BadRequest"}
        '401': {"$ref": "#/components/responses/Unauthorized"}
