            default_percent: {type: [number, "null"]}
            exceptions:
              type: array
              items: {"$ref": "#/components/schemas/MarkupRule"}
            version: {type: integer, format: int64, minimum: 0}
    Generation:
      description: Always asynchronous. Keeps task extensions (options, cost, usage, storage
        and webhook metadata). Statuses and Unix timestamps match the OpenAI video vocabulary. Costs pass through the same customer/admin financial projection. content_url
        requires the same Gateway API key. No progress percentage is invented. Managers receive
        operational metadata only, with content_access false and without prompt, input, output links or provider errors.
      properties:
        timeout_seconds: {type: integer, format: int64, description: Explicit generation HTTP timeout override, when supplied.}
        content_access: {type: boolean, description: Whether this viewer can inspect retained content.}
        can_delete: {type: boolean, description: Whether this viewer may delete stored result files.}
        user_id: {type: string, description: "Request recipient account, including in redacted metadata."}
        provider_model: {type: string, description: Native provider model ID for provenance}

        input: {type: string}
        voice: {type: string}
        instructions: {type: string}
        response_format: {type: string}
        output_format: {type: string}
        quality: {type: string}
        background: {type: string}
        image:
          type: array
          items: {type: string}
        input_reference:
          type: array
          items: {type: string}
        completed_at:
          description: Result archival time if recorded; null until known.
          type:
          - integer
          - "null"
        content_url:
          type: string
        cost:
          $ref: '#/components/schemas/TaskCost'
        created_at:
          format: int64
          type: integer
        error:
          properties:
            code:
              type: string
            message:
              type: string
          type:
          - object
          - "null"
        has_stored_result:
          type: boolean
        id:
          type: string
        media_type:
          $ref: '#/components/schemas/MediaType'
        model:
          type: string
        object:
          enum:
          - video
          - generation
          type: string
        options:
          $ref: '#/components/schemas/MediaOptions'
        prompt:
          type: string
        provider:
          type: string
        result_deleted_at:
          format: date-time
          type: string
        seconds:
          type: string
        size:
          type: string
        status:
          enum:
          - queued
          - in_progress
          - completed
          - failed
          type: string
        status_url:
          type: string
        updated_at:
          format: int64
          type: integer
        usage:
          $ref: '#/components/schemas/ProviderUsage'
      required:
      - id
      - object
      - status
      - created_at
      - updated_at
      - status_url
      type: object
    GenerationImageInput:
      description: Image URL, an object containing exactly image_url or file_id (from
        /v1/references), or a nonempty array. File IDs are checked against the authenticated
        owner. Models advertising supports_asset_references also accept asset://ID
        strings (or image_url values) for registered provider assets, mixed with URLs
        in the same ordered array. These IDs are not Gateway file_id values.
        Multipart file uploads are also supported for edits/videos.
      oneOf:
      - type: string
      - additionalProperties: false
        properties:
          image_url:
            type: string
        required:
        - image_url
        type: object
      - additionalProperties: false
        properties:
          file_id:
            type: string
        required:
        - file_id
        type: object
      - items:
          oneOf:
          - type: string
          - additionalProperties: false
            properties:
              file_id:
                type: string
            required: [file_id]
            type: object
          - additionalProperties: false
            properties:
              image_url:
                type: string
            required: [image_url]
            type: object
        minItems: 1
        type: array
    GenerationRequest:
      additionalProperties: false
      description: OpenAI-style naming with Gateway extensions. Use only fields appropriate
        for the media type. Standard fields are accepted only at the top level; only advertised options.parameters
        keys are accepted. JSON limit 64 KiB.
      properties:
        timeout_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036
          description: Gateway HTTP response deadline for generation submission, including body reading. Overrides connection.timeout_seconds; otherwise inherits the provider default (30 seconds). Does not change the asynchronous rendering lifetime. Persisted across worker restarts and part of idempotency matching. No automatic submission retries.
        background:
          type: string
        image:
          $ref: '#/components/schemas/GenerationImageInput'
        input:
          description: Text to synthesize.
          maxLength: 10000
          type: string
        input_reference:
          $ref: '#/components/schemas/GenerationImageInput'
        instructions:
          type: string
        max_expected_cost_usd:
          description: Gateway customer-price ceiling, including markup. Admission rejects
            a higher quote.
          minimum: 0
          type: number
        model:
          description: Exact public ID from GET /v1/models. Defaults to provider/model and can be renamed by the administrator. Separate provider and media_type request fields are not accepted.
          type: string
        "n":
          description: One image per asynchronous job.
          enum:
          - 1
          type: integer
        options:
          $ref: '#/components/schemas/MediaOptions'
        output_format:
          description: Image output encoding supported by the model, e.g. png/jpeg/webp.
          type: string
        prompt:
          maxLength: 10000
          description: Text direction, subject to the model's limits. May be omitted or empty when prompt_optional or no_prompt is advertised; no_prompt rejects nonempty text.
          type: string
        quality:
          type: string
        response_format:
          description: Speech audio encoding supported by the model; for images only url
            is supported. All endpoints return an asynchronous job, never immediate bytes/base64.
          type: string
        seconds:
          description: Video duration. Model-specific limits apply; no restriction to
            OpenAI durations.
          pattern: ^[1-9][0-9]*$
          type: string
        size:
          description: Image WIDTHxHEIGHT (mapped to the provider catalog), or video WIDTHxHEIGHT
            mapped exactly to supported resolution and ratio. Catalog resolution strings
            are also accepted.
          type: string
        stream:
          description: All generations are asynchronous. Streaming is not supported.
          enum:
          - false
          type: boolean
        voice:
          description: Speech voice ID supported by the model.
          type: string
        webhook_url:
          format: uri
          type: string
      required:
      - model
      type: object
    OpenAIModel:
      properties:
        capabilities:
          $ref: '#/components/schemas/MediaModel'
        created:
          description: Provider API creation timestamp when available; null otherwise.
            This is not a release date.
          type:
          - integer
          - "null"
        id:
          type: string
        object:
          const: model
          type: string
        owned_by:
          type: string
        provider:
          type: string
      required:
      - id
      - object
      - created
      - owned_by
      - provider
      - capabilities
      type: object
