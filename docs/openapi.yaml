            "$ref": "#/components/schemas/MediaModel"
    MediaModel:
      type: object
      required:
      - id
      - display_name
      - media_type
      - resolutions
      - ratios
      - min_duration
      - max_duration
      - default_duration
      - supports_audio
      - supports_draft
      - supports_camera_fixed
      - supports_last_frame
      - pricing
      properties:
        public_id: {type: string, description: Public model identifier used for generation requests}

        metadata:
          $ref: '#/components/schemas/ModelMetadata'
        parameters:
          type: array
          items: {$ref: '#/components/schemas/ParameterField'}
        qualities: {type: array, items: {type: string}}
        backgrounds: {type: array, items: {type: string}}
        no_language: {type: boolean}
        no_instructions: {type: boolean}
        prompt_optional:
          type: boolean
          description: The model accepts an empty prompt, for example when direction comes from reference media.
        no_prompt:
          type: boolean
          description: The model operates on media inputs without a text prompt. Omit prompt or use an empty string.
        reference_prompt_syntax:
          type: string
          enum: [numbered, picture]
          description: UI hint for ordered Image N or Agnes <Picture N> prompt previews. Does not rewrite the prompt or enable provider asset management. Wan first_frame_references numbers reference images after the first frame.
        supports_asset_references:
          type: boolean
          description: Accepts registered provider asset://ID references for image, video and audio inputs allowed by reference_modes. Assets must be ready and accessible to the configured provider account and project.
        reference_modes:
          type: array
          description: Allowed reference combinations; shared by server validation and the console.
          items:
            type: object
            properties:
              id: {type: string}
              label: {type: string}
              min_images: {type: integer}
              max_images: {type: integer}
              min_videos: {type: integer}
              max_videos: {type: integer}
              min_audios: {type: integer}
              max_audios: {type: integer}
              max_visuals: {type: integer, description: "Combined image/video limit, if set."}
              requires_visual: {type: boolean, description: "Audio requires at least one image or video."}
              supports_reference_voice: {type: boolean}
              image_roles: {type: array, items: {type: string}, description: "Labels assigned to images by position; remaining images are ordinary references."}

        duration_step:
          type: integer
          description: Allowed duration increments, starting at min_duration. Omitted means one second.
        duration_from_input:
          type: boolean
          description: Output duration follows the input media; omit seconds and options.duration.
        max_seed:
          type: integer
          description: Model-specific upper bound for options.seed.
        no_seed:
          type: boolean
          description: When true, omit options.seed.
        no_watermark:
          type: boolean
          description: When true, omit options.watermark.
        audio_always_on:
          type: boolean
          description: The model does not offer a silent-generation switch. Omit generate_audio or set it to true.

        id:
          type: string
        display_name:
          type: string
        media_type:
          "$ref": "#/components/schemas/MediaType"
        resolutions:
          type: array
          items:
            type: string
        ratios:
          type: array
          items:
            type: string
        min_duration:
          type: integer
        max_duration:
          type: integer
        default_duration:
          type: integer
        supports_audio:
          type: boolean
        supports_draft:
          type: boolean
        draft_resolutions:
          type: array
          items:
            type: string
        supports_camera_fixed:
          type: boolean
        supports_last_frame:
          type: boolean
        supports_image_input:
          type: boolean
        requires_image_input:
          type: boolean
        min_image_inputs:
          type: integer
        max_image_inputs:
          type: integer
        supports_audio_input:
          type: boolean
        requires_audio_input:
          type: boolean
        supports_video_input:
          type: boolean
        requires_video_input:
          type: boolean
        supports_negative_prompt:
          type: boolean
        supports_lyrics:
          type: boolean
        supports_gender:
          type: boolean
        supports_voice:
          type: boolean
        requires_voice:
          type: boolean
        voices:
          type: array
          items:
            type: string
        formats:
          type: array
          items:
            type: string
        pricing:
          "$ref": "#/components/schemas/ModelPricing"
      description: Discover capabilities at runtime. Lists, requirements, pricing
        and supported options vary by provider, account and model.
    ProviderConnection:
      type: object
      description: Administrator-managed API settings. Omitted connection preserves the existing object; when supplied it replaces it. Header values omitted on existing operation/name pairs preserve saved secrets. Manual models survive discovery refreshes. Unknown prices block budgeted generation until a per-request tariff is explicitly configured.
      properties:
        timeout_seconds: {type: [integer, "null"], format: int64, minimum: 1, maximum: 9223372036, description: API response deadline in seconds. Omit or null to inherit PROVIDER_HTTP_TIMEOUT (default 30 seconds). Generation timeout_seconds overrides it for submission only.}
        manual_catalog: {type: boolean, description: Skip remote discovery and use manual models only.}
        endpoints:
          type: object
          additionalProperties: false
          properties:
            models: {type: string}
            generate: {type: string}
            poll: {type: string, description: "Task status URL or absolute path with a {task_id} placeholder."}
        headers:
          type: array
          maxItems: 64
          items:
            type: object
            required: [name]
            properties:
              name: {type: string}
              value: {type: string, writeOnly: true}
              hint: {type: string, readOnly: true}
              operation: {type: string, enum: ['', models, generate, poll]}
        extra_body: {type: object, additionalProperties: true, description: Optional body overrides; model and input content are protected.}
        models:
          type: array
          maxItems: 250
          items:
            type: object
            required: [model, profile]
            properties:
              profile: {type: string, description: ID of a supported API request profile from the types endpoint.}
              model: {type: object, additionalProperties: true, description: "Media model capabilities including exact upstream id, display_name and media_type."}
              price_usd: {type: number, minimum: 0, maximum: 1000000, description: Explicit price per request. Omit for unknown pricing.}
              extra_body: {type: object, additionalProperties: true}
