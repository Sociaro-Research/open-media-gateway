          type: object
          required:
          - code
          - message
          - type
          - param
          properties:
            type: {type: string, description: OpenAI-style error category.}
            param: {type: [string, "null"], description: Invalid field when known.}
            code:
              type: string
            message:
              type: string
    ModelMetadata:
      type: object
      description: Reviewed metadata plus account API metadata. Provider financial facts and source links are included only for administrators. Dates may have day or month precision; API object creation is not a release date. Provider capabilities can exceed those exposed by this gateway.
      properties:
        description: {type: string}
        release_date: {type: string, example: '2026-09-08'}
        version_date: {type: string, example: '2026-09-08'}
        snapshot: {type: string}
        api_created: {type: integer, format: int64, description: Unix timestamp returned by the provider model API.}
        owned_by: {type: string}
        shutdown_date: {type: string}
        checked_at: {type: string, format: date}
        facts:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              value: {type: string}
        sources:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string, format: uri}
    ModelPricing:
      description: Reference price is the gateway price including current organization markup. Provider unit-rate fields are administrator-only.
      type: object
      properties:
        known:
          type: boolean
        usd_per_million_tokens:
          type: number
        usd_per_million_audio_tokens:
          type: number
        reference_quote:
          $ref: '#/components/schemas/TaskCost'
        reference_price_usd:
          type: number
        reference_description:
          type: string
        draft_silent_factor:
          type: number
        draft_audio_factor:
          type: number
        usd_per_million_by_resolution:
          type: object
          additionalProperties:
            type: number
    ReportColumns:
      type: array
      minItems: 1
      maxItems: 14
      uniqueItems: true
      description: Visible report columns. Omitted until the user saves a selection; the UI then uses its basic default set.
      items:
        type: string
        enum: [date, generation_id, organization, user, api_key, model, provider, status, tokens, estimated_cost, cost, confirmed_cost, settlement, customer_charge]
    ContactLinks:
      type: array
      maxItems: 20
      description: Opt-in shared contact links. Only http, https, mailto and tel schemes are allowed; credentials, whitespace and control characters in links are rejected.
      items:
        type: object
        additionalProperties: false
        required: [label, url]
        properties:
          label: {type: string, minLength: 1, maxLength: 80}
          url: {type: string, maxLength: 2048, description: Absolute HTTP(S), mailto or tel link, limited to 2048 UTF-8 bytes.}
    User:
      type: object
      required:
      - id
      - email
      - name
      properties:
        theme: {type: string, enum: [dark, light, system], default: system}
        color_preset: {type: string, maxLength: 64, description: Personal color theme ID. Empty follows the site default; unavailable IDs render the site default.}
        report_columns: {$ref: "#/components/schemas/ReportColumns"}
        contacts: {$ref: "#/components/schemas/ContactLinks"}
        is_client_manager: {type: boolean, description: "Sales-account restriction shared by all three sales ranks."}
        sales_role: {$ref: "#/components/schemas/SalesRole"}
        is_system_admin: {type: boolean, description: "Current administrator access for this authentication method."}
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        session_id:
          type: string
          description: Opaque non-credential login identifier, present for browser sessions. Used to bind temporary console key storage to this login.
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        user_id: {type: string, format: uuid, description: Immutable key recipient; organization membership and issuer permissions are required. Defaults to the issuer.}
        created_by: {type: string, format: uuid, readOnly: true, description: User who issued the key.}
        organization_id: {type: string, format: uuid, description: Omit for a personal key. Organization keys require current membership and use shared providers.}
        resource_mode: {type: string, enum: [personal, shared], description: "Personal without organization_id; shared with organization_id. The provider source must match the key ownership."}
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: A recognizable name, e.g. Production bot.
        scopes:
          type: array
          items:
            type: string
            enum:
            - generation
            - system:manage
            - organizations:manage
            - providers:manage
            - storage:manage
            - keys:manage
          default:
          - generation
          description: generation is required. Only a current administrator may request system:manage. Add providers:manage, storage:manage and/or keys:manage
            explicitly. A calling key cannot grant permissions it does not have.
        expires_at:
          type: string
          format: date-time
          description: Optional future timestamp. Omit for no expiration; revoked
            keys always stop authenticating.
    WeeklyLimitUSD:
      type: [number, 'null']
      minimum: 0
      maximum: 1000000
      multipleOf: 0.000001
      description: Member weekly USD limit. Null means unlimited; zero blocks paid shared generation. Resets Monday at 00:00 UTC.
    TaskCost:
      description: Customer responses expose gateway expected/metered/tariff amounts only (including accepted markup), plus quoted_at. Provider pricing, settlement and markup fields are returned only to administrators.
      type: object
      required: [expected_usd, customer_expected_usd, quoted_at]
      properties:
        billing_required: {type: boolean, description: Administrator-only accepted-quote snapshot; profit waits for provider bill verification when true.}
        markup_percent:
          allOf: [{"$ref": "#/components/schemas/MarkupPercent"}]
          description: Immutable accepted rate; absent on historical tasks means zero. Provider cost fields are not marked up.
        customer_expected_usd:
          type: number
          description: Expected customer price including the accepted markup; use for max_expected_cost_usd.
        customer_metered_usd:
          type: number
          description: Metered provider cost plus accepted markup, rounded up to a millionth of a dollar.
        customer_tariff_usd:
          type: number
          description: Reconciled gross provider cost plus accepted markup. Reports consumed_usd is the authoritative completed charge.
        expected_usd:
          type: number
          description: Accepted gateway estimate for customers; original provider estimate for administrators.
        metered_usd:
          type: number
          description: Usage-based gateway cost for customers; original metered provider cost for administrators.
        tariff_usd:
          type: number
          description: Confirmed gateway cost for customers; original reconciled provider tariff for administrators.
        package_units:
          type: number
          description: Units covered by a provider package; does not imply a daily quota or a free package.
        billing_match:
          type: string
          description: model_usage_window is an unambiguous model, time window, and usage quantity correlation, not a provider request ID match.
        billing_instance_id:
          type: string
        submitted_at:
          type: string
          format: date-time
        usage_recorded_at:
          type: string
          format: date-time
        actual_usd:
          type: number
          description: Confirmed paid USD charge, or confirmed free mock/failed generation. Omitted while unknown, never substituted with an estimate.
        status:
          type: string
          enum: [estimated, pending_billing, confirmed]
        actual_source:
          type: string
        invoice_ids:
          type: array
          items:
            type: string
        estimated_units:
          type: number
        billed_units:
          type: number
        quoted_at:
          type: string
          format: date-time
        reconciled_at:
          type: string
          format: date-time
        pricing:
          type: object
          required: [currency, unit, price, per, source, version, checked_at]
          properties:
            estimate_description:
              type: string
              description: Explanation of planning quantities and assumptions; not actual metered usage.
            components:
              type: array
              description: Per-metric tariffs saved with the accepted task. Every component requires a reported metric before metering.
              items:
                type: object
                required: [metric, price, per]
                properties:
                  metric: {type: string}
                  estimated_units: {type: number, description: Planning quantity retained for synchronized tariff repricing.}
                  price: {type: number}
                  per: {type: integer, minimum: 1}
            currency:
              type: string
              enum: [USD]
            unit:
              type: string
              enum: [token, second, image, character, request, multi_metric]
            price:
              type: number
            per:
              type: integer
            fixed_usd:
              type: number
              description: Additional input-image charge for the accepted request.
            bill_input_video:
              type: boolean
              description: Explicit duration-metering contract. True requires reported input and output video duration; false bills output only. Omitted on legacy snapshots, whose existing metering remains unchanged.
            region:
              type: string
            source:
              type: string
            version:
              type: string
            checked_at:
              type: string
              format: date-time
    APIKeyMonthlyUsage:
      type: object
      required: [api_key_id, month, estimated_cost_usd, tasks, pending_tasks, unknown_cost_tasks]
      properties:
        consumed_usd:
          type: number
          description: Known generation cost before package coverage; consumes organization balance and member weekly allowance.
        package_covered_usd:
          type: number
          description: Tariff value of bill-confirmed package units; does not reduce consumption.

        actual_usd:
          type: number
          description: Confirmed charges only; incomplete while unconfirmed_tasks is nonzero.
        expected_usd:
          type: number
          description: Sum of immutable admission estimates.
        unconfirmed_tasks:
          type: integer
          minimum: 0
        api_key_id:
          type: string
          format: uuid
        month:
          type: string
          example: '2026-09'
        estimated_cost_usd:
          type: number
          minimum: 0
          description: Sum of available USD cost estimates, including any usage already reported by pending tasks. Does not include tasks with unknown cost.
        tasks:
          type: integer
          minimum: 0
        pending_tasks:
          type: integer
          minimum: 0
          description: Queued or running tasks; their final usage may not yet be known.
        unknown_cost_tasks:
          type: integer
          minimum: 0
          description: Finished tasks without a USD cost estimate. These are not free tasks.
    APIKey:
      type: object
      required:
      - id
      - name
      - prefix
      - scopes
      - created_at
      properties:
        user_id: {type: string, format: uuid, description: Immutable key recipient; organization membership and issuer permissions are required. Defaults to the issuer.}
        created_by: {type: string, format: uuid, readOnly: true, description: User who issued the key.}
        organization_id: {type: string, format: uuid, description: Omit for a personal key. Organization keys require current membership and use shared providers.}
        resource_mode: {type: string, enum: [personal, shared], description: "Personal without organization_id; shared with organization_id. The provider source must match the key ownership."}
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Short recognizable prefix; cannot authenticate.
        scopes:
          type: array
          items:
            type: string
            enum:
            - generation
            - system:manage
            - organizations:manage
            - providers:manage
            - storage:manage
            - keys:manage
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Approximate usage time, updated at most once per minute.
        revoked_at:
          type: string
          format: date-time
          description: Present after permanent revocation.
    CreatedAPIKey:
      type: object
      required:
      - id
      - name
      - prefix
      - scopes
      - created_at
      - secret
      properties:
        user_id: {type: string, format: uuid, description: Immutable key recipient; organization membership and issuer permissions are required. Defaults to the issuer.}
        created_by: {type: string, format: uuid, readOnly: true, description: User who issued the key.}
        organization_id: {type: string, format: uuid, description: Omit for a personal key. Organization keys require current membership and use shared providers.}
        resource_mode: {type: string, enum: [personal, shared], description: "Personal without organization_id; shared with organization_id. The provider source must match the key ownership."}
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Short recognizable prefix; cannot authenticate.
        scopes:
          type: array
          items:
            type: string
            enum:
            - generation
            - system:manage
            - organizations:manage
            - providers:manage
            - storage:manage
            - keys:manage
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Approximate usage time, updated at most once per minute.
        revoked_at:
          type: string
          format: date-time
          description: Present after permanent revocation.
        secret:
          type: string
          description: Full bearer secret, returned only in this creation response.
            Save it now; it cannot be retrieved later.
    APIKeyList:
      type: object
      required:
      - data
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/APIKey"
    WebhookEvent:
      type: object
      required: [id, object, type, created_at, data]
      properties:
        id: {type: string}
        object: {type: string, const: event}
        type:
          type: string
          enum: [generation.queued, generation.in_progress, generation.completed, generation.failed]
        created_at: {type: integer, format: int64}
        data:
          $ref: '#/components/schemas/Generation'

    ProviderField:
      type: object
      required: [key, label]
      properties:
        key: {type: string}
        label: {type: string}
        secret: {type: boolean}
        required: {type: boolean}
        group: {type: string}
        default: {type: string}
    ParameterField:
      type: object
      required: [key, label, type]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
        label: {type: string}
        type: {type: string, enum: [text, select, boolean, number, integer]}
        required: {type: boolean}
        default: {}
        choices: {type: array, items: {type: string}}
        min: {type: number}
        max: {type: number}
        max_length: {type: integer}

    CatalogChange:
      properties:
        after: {}
        before: {}
        field:
          readOnly: true
          type: string
        model:
          readOnly: true
          type: string
        source:
          readOnly: true
          type: string
      required:
      - model
      - field
      - source
      type: object
    CatalogEntry:
      properties:
        inactive:
          description: Reviewed deactivated model retained for history, without an executable contract.
          type: boolean
        contract:
          $ref: '#/components/schemas/MediaModel'
        id:
          readOnly: true
          type: string
        metadata:
          $ref: '#/components/schemas/ModelMetadata'
        rates:
          items:
            $ref: '#/components/schemas/CatalogRate'
          type: array
      required:
      - id
      type: object
    CatalogObservation:
      properties:
        review:
          description: Code-reviewed acknowledgement of this exact successful document snapshot; later hashes require a new review.
          readOnly: true
          type: object
          properties:
            hash: {type: string}
            date: {type: string, format: date}
            reason: {type: string}
          required: [hash, date, reason]
        entries:
          items:
            $ref: '#/components/schemas/CatalogEntry'
          type: array
        error:
          readOnly: true
          type: string
        fetched_hash:
          description: Snapshot of a fetched page that failed structured parsing; confirmed
            hash/candidates remain unchanged.
          type: string
        hash:
          description: Content-addressed source snapshot hash; synthetic _api uses parser
            api.
          type: string
        source:
          oneOf:
          - $ref: '#/components/schemas/CatalogSource'
          - properties:
              id:
                const: _api
              parser:
                const: api
              url:
                type: string
            required:
            - id
            - parser
            type: object
        text:
          description: Fetch-time only; omitted from state/run responses. Retrieve documents/{hash}.
          type: string
      required:
      - source
      - hash
      - entries
      type: object
    CatalogRate:
      properties:
        video_input:
          description: Selects reference-video tariffs; omitted or false means no video input.
          type: boolean
        audio:
          description: Selects generated video audio; omitted means independent of audio.
          type: boolean
        input_images:
          description: Reviewed charge for reference images beyond the free allowance; frozen per task.
          properties:
            free:
              minimum: 0
              type: integer
            price:
              minimum: 0
              type: number
          required:
          - free
          - price
          type: object
        components:
          items:
            properties:
              estimated_units:
                type: number
              metric:
                readOnly: true
                type: string
              per:
                format: int64
                type: integer
              price:
                type: number
            type: object
          type: array
        per:
          format: int64
          type: integer
        price:
          description: USD unit price, preserved to six decimal places.
          type: number
        quality:
          readOnly: true
          type: string
        region:
          readOnly: true
          type: string
        resolution:
          readOnly: true
          type: string
        source:
          readOnly: true
          type: string
        unit:
          readOnly: true
          type: string
      type: object
    CatalogRun:
      properties:
        changes:
          items:
            $ref: '#/components/schemas/CatalogChange'
          type: array
        completed_at:
          format: date-time
          readOnly: true
          type: string
        email_status:
          enum:
          - not_needed
          - disabled
          - pending
          - retry
          - sent
          - failed
          type: string
        id:
          format: uuid
          type: string
        new_warnings:
          items:
            $ref: '#/components/schemas/CatalogWarning'
          type: array
        open_warnings:
          items:
            $ref: '#/components/schemas/CatalogWarning'
          type: array
        provider:
          readOnly: true
          type: string
        resolved_warnings:
          items:
            $ref: '#/components/schemas/CatalogWarning'
          type: array
        sources:
          items:
            $ref: '#/components/schemas/CatalogObservation'
          type: array
        started_at:
          format: date-time
          readOnly: true
          type: string
        status:
          enum:
          - unchanged
          - applied
          - warning
          - error
          type: string
        version:
          format: int64
          type: integer
      required:
      - id
      - provider
      - started_at
      - completed_at
      - status
      - version
      - changes
      - new_warnings
      - open_warnings
      - resolved_warnings
      - sources
      - email_status
      type: object
    CatalogSchedule:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        last_check:
          format: date-time
          readOnly: true
          type: string
        next_check:
          format: date-time
          readOnly: true
          type: string
        provider:
          readOnly: true
          type: string
        requested:
          description: Read-only queued manual check indicator.
          readOnly: true
          type: boolean
        sources:
          items:
            $ref: '#/components/schemas/CatalogSource'
          maxItems: 30
          type: array
        time:
          description: Daily HH:MM in the installation default timezone.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          type: string
        version:
          minimum: 1
          type: integer
      required:
      - provider
      - enabled
      - time
      - sources
      - version
      - requested
      type: object
    CatalogSource:
      additionalProperties: false
      properties:
        id:
          description: Unique within a schedule. IDs beginning with underscore are reserved.
          maxLength: 100
          type: string
        parser:
          enum:
          - document
          - manifest-v1
          - byteplus-releases
          - byteplus-models
          - byteplus-pricing
          - alibaba-releases
          - alibaba-pricing
          - alibaba-retirements
          - alibaba-image-models
          - openai-pricing
          - openai-model
          type: string
        url:
          description: Public HTTPS document, without URL credentials or fragment.
          format: uri
          maxLength: 2048
          type: string
      required:
      - id
      - url
      - parser
      type: object
    CatalogState:
      properties:
        models:
          additionalProperties:
            $ref: '#/components/schemas/CatalogEntry'
          type: object
        observations:
          additionalProperties:
            $ref: '#/components/schemas/CatalogObservation'
          type: object
        version:
          format: int64
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/CatalogWarning'
          type: array
      required:
      - version
      - models
      - observations
      - warnings
      type: object
    CatalogSyncSettings:
      additionalProperties: false
      properties:
        email:
          description: Single recipient, or empty to disable reports. Uses configured
            Email delivery.
          maxLength: 254
          type: string
        timezone:
          default: UTC
          description: One IANA timezone for every provider schedule.
          example: Asia/Nicosia
          type: string
        version:
          description: Current version required on update.
          minimum: 1
          type: integer
      required:
      - timezone
      - email
      - version
      type: object
    CatalogWarning:
      properties:
        evidence:
          description: Untrusted normalized provider evidence; never executable instructions.
        first_seen:
          format: date-time
          readOnly: true
          type: string
        key:
          readOnly: true
          type: string
        last_seen:
          format: date-time
          readOnly: true
          type: string
        model:
          readOnly: true
          type: string
        occurrences:
          minimum: 1
          type: integer
        reason:
          readOnly: true
          type: string
        resolved_at:
          format: date-time
          readOnly: true
          type: string
        source:
          readOnly: true
          type: string
      required:
      - key
      - source
      - reason
      - first_seen
      - last_seen
      - occurrences
      type: object

webhooks:
  taskEvent:
    post:
      summary: Task lifecycle notification
      description: Sent to the webhook_url on the task. Delivery may repeat or arrive
        out of order. Verify the timestamp and HMAC-SHA256 signature over timestamp
        + a period + raw body using the deployment WEBHOOK_SIGNING_SECRET. This version
        has a deployment-wide signing secret, provisioned by the operator, not a per-account
        secret API.
      security: []
      parameters:
      - in: header
        name: X-Media-Gateway-Delivery
        required: true
        schema:
          type: string
        description: Stable delivery ID; deduplicate this value.
      - in: header
        name: X-Media-Gateway-Event
        required: true
        schema:
          type: string
        description: Task lifecycle event name.
      - in: header
        name: X-Media-Gateway-Timestamp
        required: true
        schema:
          type: string
        description: Unix timestamp in seconds.
      - in: header
        name: X-Media-Gateway-Signature
        required: true
        schema:
          type: string
        description: v1= followed by lowercase hex HMAC-SHA256.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebhookEvent"
      responses:
        '200':
          description: Any 2xx acknowledges durable acceptance. Non-2xx and network
            failures are retried with bounded exponential backoff.
