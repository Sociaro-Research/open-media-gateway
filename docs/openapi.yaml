      operationId: head_v1_videos_id_content
      responses:
        '307':
          description: S3 file; follow the signed storage URL without forwarding Gateway credentials. S3 serves file bytes and Range requests directly.
          headers:
            Location: {schema: {type: string, format: uri}}
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: Stored media
        "206":
          description: Partial content
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Result not available
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not ready
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
      summary: Inspect generation content
