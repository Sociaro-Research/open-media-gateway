        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Library not configured, registration unresolved, or asset in use/shared.}
        '502': {description: Provider asset operation failed; an uncertain registration must not be repeated blindly.}
    delete:
      operationId: delete_workspace_provider_asset
      tags: [References]
      summary: Delete a remote asset or detach its workspace binding
      description: Requires write content access. Without detach, permanently deletes from BytePlus after checking queued/running tasks and other workspace bindings. The My storage original is retained. Pending/unknown registrations cannot be detached. Failures preserve retryable state; deletion markers block new task admission.
      parameters:
      - in: query
        name: detach
        schema: {type: string, enum: ['1']}
        description: Remove only this workspace binding; retain the remote asset.
      responses:
        '204': {description: Asset deleted or workspace binding removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Library not configured, registration unresolved, or asset in use/shared.}
        '502': {description: Provider asset operation failed; an uncertain registration must not be repeated blindly.}
