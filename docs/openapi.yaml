      properties:
        browser_uploads_pending:
          type: boolean
          readOnly: true
          description: Present and true on Save when CORS was confirmed but browser access may still be propagating. Retry the read-only connection check; the policy does not need another write.
        driver:
          type: string
          enum: [local, s3, gateway]
        endpoint:
          type: string
          description: HTTP(S) origin. Empty selects standard AWS endpoints.
        region:
          type: string
          description: Bucket region; auto for Cloudflare R2.
        bucket:
          type: string
        prefix:
          type: string
        path_style:
          type: boolean
        access_key_id:
          type: string
          readOnly: true
          description: Saved key identifier, not the secret. Empty when no key is configured.
        credentials_configured:
          type: boolean
    StorageUpdate:
      type: object
      additionalProperties: false
      required: [driver]
      properties:
        driver:
          type: string
          enum: [local, s3, gateway]
        endpoint:
          type: string
          description: HTTP(S) origin without path, query or embedded credentials. A missing scheme defaults to HTTPS. Empty for AWS S3.
        region:
          type: string
          description: Required for S3. Use auto for Cloudflare R2.
        bucket:
          type: string
          description: Existing bucket, required for S3.
        prefix:
          type: string
          maxLength: 512
        path_style:
          type: boolean
          default: false
        access_key_id:
          type: string
          writeOnly: true
          description: Required for initial S3 setup and endpoint changes. Blank preserves saved value.
        secret_access_key:
          type: string
          writeOnly: true
          description: Required for initial S3 setup and endpoint changes. Blank preserves saved value.
    Health:
