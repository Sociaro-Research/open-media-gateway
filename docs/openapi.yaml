      name: provider
      required: true
      schema: {type: string}
      description: Selected provider connection ID.
    get:
      operationId: list_workspace_provider_assets
      tags: [References]
      summary: List and refresh workspace asset bindings
      description: Requires generation scope and current content permissions; Developers and Members are restricted to their own bindings.
      parameters:
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Workspace assets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderAssetBindings'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Library not configured, registration unresolved, or asset in use/shared.}
        '502': {description: Provider asset operation failed; an uncertain registration must not be repeated blindly.}
    post:
      operationId: register_provider_asset
      tags: [References]
      summary: Register a Gateway reference with the selected provider
      description: Requires write content access. The original remains in My storage and cannot be deleted during ingestion. Uses a signed HTTPS URL; never accepts arbitrary external URLs. Duplicate source registrations reuse their durable binding. A 202 response is preparation state, not proof of readiness. Wait for Active before using uri. Uncertain creates are reconciled without automatic resubmission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference_id, group_id]
              properties:
                reference_id: {type: string, format: uuid}
                group_id: {type: string}
      responses:
        '202':
          description: Registration state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderAssetBinding'}
