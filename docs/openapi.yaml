  "/v1/references/uploads":
    post:
      operationId: post_v1_references_uploads
      tags: [References]
      summary: Prepare a direct reference upload
      description: >-
        Requires generation scope. Send metadata only. For S3, returns a signed
        PUT target for a single multipart part. Presigned URL targets expire after
        15 minutes; B2 uses timestamped SigV4 upload headers. Upload the exact
        file bytes with the returned headers directly to that URL, without Gateway
        credentials, then call the completion endpoint within 30 minutes. The SHA-256
        must be the lowercase hexadecimal hash of the entire file. S3 verifies it.
        Maximum sizes are 30 MiB for images, 200 MiB for video and 50 MiB for audio.
        A duplicate returns mode=existing and reference. Local storage returns mode=local;
        only in this mode use POST /v1/references with multipart/form-data.
        Browser transfers require bucket CORS for the frontend origin and PUT/GET/HEAD; saving the storage connection configures missing access automatically when the key has CORS management rights. B2 targets use payload-signed Authorization and x-amz-date headers; send all target headers. CORS must explicitly allow Authorization for B2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, content_type, size_bytes, sha256]
              properties:
                name: {type: string}
                content_type: {type: string, example: image/png}
                size_bytes: {type: integer, minimum: 1, maximum: 209715200}
                sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '200':
          description: Existing file; mode=existing and reference contains its library entry
        '201':
          description: Upload prepared
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  mode: {type: string, enum: [s3, local]}
                  target:
                    type: object
                    properties:
                      url: {type: string, format: uri}
                      headers: {type: object, additionalProperties: {type: string}}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/references/uploads/{id}/complete":
    parameters:
    - in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    post:
      operationId: post_v1_references_uploads_id_complete
      tags: [References]
      summary: Verify and finish a direct reference upload
      description: >-
        Requires the same owner and generation scope as preparation. Exchanges only S3
        metadata, verifies the single part size and pinned ETag after storage has validated
        the signed SHA-256 payload header, consumes the multipart
        upload ID and adds the file to the library. Retry this endpoint if the response
        is lost; successful completions return the same file while the upload receipt
        remains available (at least 90 minutes from preparation). No file body is sent.
        Failed or abandoned uploads are reclaimed by the worker after expiry.
      responses:
        '200':
          description: Saved reference or existing duplicate
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReferenceImage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '410': {description: Upload expired; prepare a new upload}
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/v1/references":
    get:
      operationId: get_v1_references
      tags: [References]
      summary: List your reference files, newest first
      description: Requires the generation scope when using a personal API key.
      parameters:
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: Up to 48 files from the authenticated owner's library
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more, next_offset]
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ReferenceImage"
                  has_more: {type: boolean}
                  next_offset: {type: integer}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
    post:
      operationId: post_v1_references
      tags: [References]
      summary: Upload one reference file to local storage
      description: Local storage only; S3 returns 409 direct_upload_required before reading the body. Use POST /v1/references/uploads for S3. Saves a PNG, JPEG, WebP or GIF (30 MiB), MP4, MOV or WebM (200 MiB), or MP3, WAV, OGG or FLAC (50 MiB) in the organization's selected local storage, under <organization-id>/references/. Non-administrators must use shared storage or personal S3 storage. Requires generation scope. Uploading does not create a generation task. The server detects the media type from the uploaded bytes. Identical content (SHA-256) is reused within the same organization, regardless of uploader or filename. Returns 200 and duplicate=true for an existing file; no additional file is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Identical file already exists; the existing file is returned with duplicate=true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReferenceImage"
        '201':
          description: File saved in the reusable library
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReferenceImage"
        '409': {description: S3 requires direct upload; use POST /v1/references/uploads}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
