      tags: [References]
      summary: Permanently delete a reference file
      description: Deletes the physical file from its original storage and removes its library entry. Pending generations using its URL may fail. Provider registrations still ingesting this source block deletion with 409. Requires generation scope and current write content permissions; Developers and Members can delete their own files, Supermanagers can delete workspace files, and other organizations receive 404. Storage failures preserve metadata for a retry.
      responses:
        '204': {description: File deleted}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
