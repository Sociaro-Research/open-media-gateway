  /v1/storage/usage:
    get:
      operationId: getStorageUsage
      tags: [Storage]
      summary: Read the caller's current shared-storage usage
      description: Requires a generation key. Counts currently stored shared files across all keys and all time. Applies is false for keys using personal storage. Exceeded means used_bytes is strictly greater than limit_bytes; null limit means unlimited.
      responses:
        '200':
          description: Shared storage usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  used_bytes: {type: integer, format: int64}
                  unknown_objects: {type: integer, description: Legacy files whose sizes are being verified.}
                  limit_bytes: {type: [integer, 'null'], format: int64}
                  applies: {type: boolean}
                  exceeded: {type: boolean}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  /v1/system/storage/quota:
    get:
      operationId: getSharedStorageQuota
      tags: [System]
      x-required-scope: system:manage
      summary: Read the global per-user shared-storage allowance
      responses:
        '200': {description: 'Object with limit_bytes (nullable integer) and version.'}
        '403':
          "$ref": "#/components/responses/Forbidden"
    put:
      operationId: setSharedStorageQuota
      tags: [System]
      x-required-scope: system:manage
      summary: Set the global per-user shared-storage allowance
      description: Requires a current administrator. Only new uploads and generations are blocked when current usage already exceeds the limit. Accepted tasks always archive their results. Does not change monetary budgets or delete any files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_bytes, version]
              additionalProperties: false
              properties:
                limit_bytes: {type: [integer, 'null'], minimum: 0, maximum: 1000000000000000}
                version: {type: integer, minimum: 1}
      responses:
        '200': {description: 'Updated limit_bytes and version.'}
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409': {description: Settings changed; reload before saving.}

