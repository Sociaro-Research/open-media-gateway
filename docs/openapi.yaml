---
openapi: 3.1.0
info:
  title: Media Gateway API
  version: 1.0.0
  description: One asynchronous API for image, video, speech and music generation.
    Connect providers once, then access your organization through the console or your
    applications. Generation endpoints use OpenAI vocabulary with asynchronous Gateway
    extensions. All creation returns a queued job, not immediate media. All generation routes share one contract; this is not drop-in synchronous SDK compatibility.
    Agnes AI image and video models use the same endpoints and catalog contract;
    select agnes/model-name from the model catalog. Provider key checks cannot
    verify Agnes access because its upstream model catalog is public.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: "/"
  description: This Gateway deployment
security:
- bearerAuth: []
tags:
- name: Generations
- name: Catalog
- name: Media
- name: References
- name: Providers admin
- name: Storage admin
- name: Storage
- name: API keys
- name: Reports
- name: Audit
- name: Account
- name: System
- name: Organizations
- name: Payments
paths:
  /legal/{kind}:
    get:
      operationId: get_legal_kind
      summary: Read a public plain-text legal document override
      security: []
      parameters:
      - {in: path, name: kind, required: true, schema: {type: string, enum: [privacy, terms]}}
      responses:
        '200':
          description: Empty text selects the bundled frontend template. Never render text as HTML.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: {type: string}
        '404': {description: Unknown document}
        '503': {description: Document storage unavailable}
  /v1/system/legal/{kind}:
    parameters:
    - {in: path, name: kind, required: true, schema: {type: string, enum: [privacy, terms]}}
    get:
      operationId: get_v1_system_legal_kind
      summary: Read legal document settings (Administrator only)
      responses:
        '200':
          description: Saved override and optimistic concurrency token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalDocument'}
        '401': {description: Authentication required}
        '403': {description: Administrator required}
    put:
      operationId: put_v1_system_legal_kind
      summary: Publish or reset a plain-text legal document (Administrator only)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LegalDocument'}
      responses:
        '200':
          description: Saved document with incremented concurrency token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LegalDocument'}
        '400': {description: Invalid text, version or request body}
        '401': {description: Authentication required}
        '403': {description: Administrator required}
        '409': {description: Document changed since it was opened}
  "/site.json":
    get:
      tags: [Account]
      summary: Read public site origins and appearance
      operationId: get_site_configuration
      security: []
      description: Public metadata used by independently served frontends. Assets include MIME metadata; download image bytes from /branding/assets/{asset}.
      responses:
        '200':
          description: API, UI and documentation origins plus branding settings. Empty origins use the current origin.
  "/auth/session":
    get:
      tags: [Account]
      summary: Check browser session for frontend delivery
      operationId: get_browser_session
      security: []
      description: Cookie-only preflight for the UI file server. API keys do not establish browser sessions. Returns 204 when browser authentication is disabled.
      responses:
        '204': {description: Valid session or browser authentication disabled}
        '401': {description: Browser sign-in required}

  "/auth/monitoring":
    get:
      tags: [Account]
      summary: Authorize the monitoring UI proxy
      operationId: get_monitoring_session
      security: [{sessionAuth: []}]
      description: Cookie-only preflight for Grafana. Requires an active browser session and a current system Administrator role. API keys and caller-supplied identity headers cannot grant access. Browser authentication disabled is denied. The UI proxy uses the returned internal user ID only after a successful check; this header is not a reusable credential.
      responses:
        '204':
          description: Current Administrator browser session
          headers:
            X-WEBAUTH-USER:
              description: Verified internal user ID for the private Grafana auth proxy
              schema: {type: string}
        '401': {description: Browser sign-in required}
        '403': {description: Administrator access required}
        '503': {description: Administrator role could not be verified}

  /v1/organizations/{org}/balance-history:
    get:
      tags: [Payments]
      operationId: get_organization_balance_history
      summary: List unified balance activity
      description: Returns manual credits, payment credits and corrections, plus attempts without a ledger entry. Requires manager, assigned client manager or administrator access; API keys require organizations:manage and matching organization binding. Test payments are visible only to administrators. Newest first, 50 entries per page.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200':
          description: Unified history page
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BalanceEntry'
                  has_more: {type: boolean}
        '403': {description: Financial access or organization binding denied}
  /v1/system/payment-notifications:
    get:
      tags: [Payments]
      operationId: get_v1_system_payment_notifications
      summary: Get global payment email notification settings and delivery status
      description: Requires an administrator and system:manage scope for API keys.
      responses:
        '200':
          description: Current subscriptions and delivery queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentNotificationSettings'
        '403':
          description: Administrator access required
    put:
      tags: [Payments]
      operationId: put_v1_system_payment_notifications
      summary: Update global payment notification recipients
      description: Applies to every payment provider. Both lists must be supplied. Emails must belong to existing administrators. Empty lists disable notifications. Requires administrator access and system:manage scope for API keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentNotificationUpdate'
      responses:
        '200':
          description: Saved subscriptions and delivery queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentNotificationSettings'
        '400':
          description: Invalid lists or recipients are not existing administrators
        '403':
          description: Administrator access required
        '409':
          description: Settings version changed; reload before saving
  "/v1/system/billing":
    get:
      tags: [Payments]
      operationId: get_v1_system_billing
      summary: Read installation seller company and VAT rules
      description: Administrator only; API keys require system management access. No seller country or VAT rate is preset.
      responses:
        '200':
          description: Versioned installation billing policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentVATSettings'}
        '403': {description: Administrator access required}
    put:
      tags: [Payments]
      operationId: put_v1_system_billing
      summary: Save installation seller company and VAT rules
      description: Administrator only. Maximum request body is 1 MiB, including an optional embedded invoice logo. Rules are explicit, versioned and audited. Missing cases do not default to zero VAT. Existing payment snapshots remain immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentVATSettings'}
      responses:
        '200':
          description: Saved policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentVATSettings'}
        '400': {description: Invalid company or VAT rules}
        '403': {description: Administrator access required}
        '409': {description: Policy version changed}
  "/v1/organizations/{org}/vat-verification":
    parameters:
      - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Payments]
      operationId: get_v1_organizations_org_vat_verification
      summary: Read administrator verification of buyer VAT registration
      description: Organization management access and credential organization binding are required.
      responses:
        '200':
          description: Verification or an empty version-zero record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentVATVerification'}
        '403': {description: Organization management access required}
    put:
      tags: [Payments]
      operationId: put_v1_organizations_org_vat_verification
      summary: Record or revoke manual VAT verification
      description: Administrator only. Proof is bound to exact legal name, country and VAT number. Verified records require evidence and expire after 90 days by default, with an explicit maximum of 366 days. Browser-supplied buyer status cannot grant VAT relief.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentVATVerification'}
      responses:
        '200':
          description: Saved verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentVATVerification'}
        '400': {description: Invalid verification evidence}
        '403': {description: Administrator access required}
        '409': {description: Verification version changed}
  "/v1/system/payment-providers":
    "get":
      "tags":
        - "Payments"
      "operationId": "get_v1_system_payment_providers"
      "summary": "List payment providers"
      "description": "Administrator and system:manage when using an API key. Secrets are never returned."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "properties":
                  stablecoin_networks:
                    type: array
                    items: {type: object, description: Built-in network and accepted token contracts}
                  "data":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/PaymentProvider"
                  "available_providers":
                    "type": "array"
                    "items":
                      "type": "object"
                      "additionalProperties": false
                      "properties":
                        "id":
                          "type": "string"
                        "name":
                          "type": "string"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_system_payment_providers"
      "summary": "Configure card or stablecoin payments"
      "description": "Save disabled with a secret API key first, configure the returned webhook URL in Stripe, then update with its signing secret and enabled=true. Account and test/live mode are verified with Stripe and cannot later be changed. AUTH_PUBLIC_URL must be a public HTTPS origin."
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PaymentProvider"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PaymentProviderUpdate"
  "/v1/system/payment-providers/{id}":
    "put":
      "tags":
        - "Payments"
      "operationId": "put_v1_system_payment_providers_id"
      "summary": "Update payment configuration"
      "description": "Administrator only. Blank or omitted secrets preserve saved values. version is required for optimistic concurrency. fee_mode applies to new payments; existing payments retain their snapshot."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PaymentProvider"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PaymentProviderUpdate"
  "/v1/system/payment-providers/{id}/check":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_system_payment_providers_id_check"
      "summary": "Verify Stripe credentials"
      "description": "Checks merchant identity, test/live mode and charges_enabled without charging a card or verifying webhook delivery."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "account_id":
                    "type": "string"
                  "live":
                    "type": "boolean"
                  "charges_enabled":
                    "type": "boolean"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/v1/system/payment-providers/{id}/disable":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_system_payment_providers_id_disable"
      "summary": "Disable a payment provider or revoke an integration"
      "description": "Stops new checkouts or external settlements. Existing Stripe payments are still reconciled, including refunds and disputes. History and encrypted Stripe credentials are retained."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PaymentProvider"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "properties":
                "version":
                  "type": "integer"
              "required":
                - "version"
  "/v1/system/payment-integrations":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_system_payment_integrations"
      "summary": "Issue a trusted external payment integration credential"
      "description": "Administrator only. Returns a pay_ bearer token once; only its hash is stored. This trusted issuer can settle any organization, but has no user or general system access. Integrations use service-paid fees; Stripe fee modes are configured separately."
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "provider":
                    "$ref": "#/components/schemas/PaymentProvider"
                  "token":
                    "type": "string"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "additionalProperties": false
              "properties":
                "name":
                  "type": "string"
                  "maxLength": 100
                "live":
                  "type": "boolean"
              "required":
                - "name"
                - "live"
  "/v1/organizations/{org}/payment-methods":
    "get":
      "tags":
        - "Payments"
      "operationId": "get_v1_organizations_org_payment_methods"
      "summary": "List enabled top-up methods"
      "description": "Manager or administrator; API keys require organizations:manage. Test methods are visible only to administrators."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "data":
                    "type": "array"
                    "items":
                      "type": "object"
                      "additionalProperties": false
                      "properties":
                        stablecoin:
                          $ref: '#/components/schemas/StablecoinConfig'
                        "id":
                          "type": "string"
                        "name":
                          "type": "string"
                        "kind":
                          "type": "string"
                        "live":
                          "type": "boolean"
                        "fee_mode":
                          "type": "string"
                          "enum":
                            - "service"
                            - "organization"
                  "currency":
                    "type": "string"
                  "min_cents":
                    "type": "integer"
                  "max_cents":
                    "type": "integer"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "org"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/v1/organizations/{org}/payments":
    "post":
      "tags":
        - "Payments"
      "operationId": "post_v1_organizations_org_payments"
      "summary": "Create or resume a card or stablecoin payment"
      "description": "Stablecoins additionally require network, token and company billing details. Card payments with stripe_invoices=false require company billing details and use the same local VAT rules; Stripe only charges the quoted gross amount, without automatic_tax or invoice_creation. VAT is calculated locally from the installation seller profile and country/registration-status rules. VAT registration must be verified for status-specific treatment. There is no Stripe dependency for stablecoins. The server reserves an exact six-decimal amount including a payment fee below one cent. Manager only. Idempotency is scoped to organization and actor. Reusing the key with a different amount, provider or fee mode returns 409. The supplied fee_mode must match the displayed current provider mode for a new payment. Redirects do not grant credit. Test payments never produce spendable credits."
      "responses":
        "201":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Payment"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "org"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "Idempotency-Key"
          "in": "header"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 128
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/PaymentCheckout"
    "get":
      "tags":
        - "Payments"
      "operationId": "get_v1_organizations_org_payments"
      "summary": "List payment history"
      "description": "Manager only. Amounts are integer USD cents. credited_cents is the current net contribution after fees, refunds and disputed funds; test payments always show zero credited."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "data":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Payment"
                  "has_more":
                    "type": "boolean"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "org"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "offset"
          "in": "query"
          "schema":
            "type": "integer"
            "minimum": 0
  "/v1/organizations/{org}/payments/{id}":
    delete:
      tags: [Payments]
      operationId: delete_v1_organizations_org_payments_id
      summary: Cancel an unpaid stablecoin payment
      description: Requires organization management access. Only pending requests can be cancelled. History and the exact amount reservation are retained permanently. Confirming and paid requests return 409.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Cancelled payment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '403': {description: Organization access denied}
        '409': {description: Payment cannot be cancelled}
    "get":
      "tags":
        - "Payments"
      "operationId": "get_v1_organizations_org_payments_id"
      "summary": "Read a payment"
      "description": "Checks current management rights and the organization binding of the supplied API key."
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Payment"
        "400":
          "description": "Invalid request"
        "403":
          "description": "Role, scope, tenant or integration credential denied"
        "409":
          "description": "Version, idempotency, immutable payment data or fee mode conflict"
        "503":
          "description": "Payment verification is not available; retry the same operation"
      "parameters":
        -
          "name": "org"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
  "/v1/organizations/{org}/payments/{id}/checkout":
    post:
      operationId: post_v1_organizations_org_payments_id_checkout
      tags: [Payments]
      summary: Resume a locally invoiced Stripe payment
      description: Organization manager only. Reuses an open Checkout, or renews it after Stripe confirms the old session expired. Preserves payment ID, invoice, principal and VAT. Paid payments return their settled state. Concurrent requests and lost creation responses share a durable attempt/idempotency key. The same 30-day request deadline applies to native and locally invoiced Stripe requests. No renewal is allowed after expiry. The deadline is creation plus exactly 720 hours; an expired short Stripe session leaves the request pending before that deadline.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Existing payment with current checkout URL or already-paid status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '403': {description: Not an organization manager or wrong organization}
        '409': {description: Payment cannot currently be resumed or insufficient Stripe Checkout time remains}
        '410': {description: Payment request expired; create a new payment}
        '503': {description: Provider unavailable; no replacement is created without verification}
  "/v1/organizations/{org}/payments/{id}/invoice":
    get:
      operationId: get_v1_organizations_org_payments_id_invoice
      tags: [Payments]
      summary: Generate or download a local invoice PDF
      description: Organization manager only. Issues an immutable numbered PDF on the first request; retries return the same stored bytes. Available for stablecoins and card payments created with Stripe Invoices disabled. Uses the seller, logo, buyer and VAT snapshot saved with the payment. Due date is the request creation plus 30 days. Stablecoins show a fixed 1 USD = 1 selected token rate. Cancelled requests cannot issue invoices; expired requests can only redownload an already issued PDF. Stripe processor fees are not invoice items.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Private PDF attachment with Cache-Control no-store
          headers:
            Content-Disposition: {schema: {type: string}}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403': {description: Not an organization manager or payment belongs to another organization}
        '409': {description: Cancelled payment or no usable unpaid card checkout}
        '503': {description: Payment uses native Stripe invoicing or cannot supply a document}
  "/v1/organizations/{org}/payments/{id}/qr":
    get:
      tags: [Payments]
      operationId: get_v1_organizations_org_payments_id_qr
      summary: Read the receiving-address QR image
      description: Organization management access is required. The QR encodes the address only; the accompanying payment card specifies the token, network and exact amount.
      parameters:
        - {name: org, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Private address QR image
