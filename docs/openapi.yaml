      required: true
      schema:
        type: integer
        format: int64
      description: Expiry as a Unix timestamp
    - in: query
      name: signature
      required: true
      schema:
        type: string
    - in: query
      name: download
      schema:
        type: string
        enum:
        - '1'
    get:
      tags:
      - Media
      summary: Access media through a temporary signed URL
      security: []
      responses:
        '307':
          description: S3 file; follow the signed storage URL without forwarding Gateway credentials. S3 serves file bytes and Range requests directly.
          headers:
            Location: {schema: {type: string, format: uri}}
        '200':
          description: Complete media object
          content:
            image/*:
              schema: {type: string, format: binary}
            video/*:
              schema: {type: string, format: binary}
            audio/*:
              schema: {type: string, format: binary}
        '206':
          description: HTTP Range response
        '403':
          description: Invalid or expired URL
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          "$ref": "#/components/responses/NotFound"
      operationId: get_media_id
      description: Use the exact signed URL returned by media-access, without a Gateway
        key. Signature and expiry are required. Do not construct signatures in clients.
        Supports HEAD, Range and download=1.
    head:
      tags:
      - Media
      summary: Read signed media headers
      security: []
      responses:
        '307':
          description: S3 file; follow the signed storage URL without forwarding Gateway credentials. S3 serves file bytes and Range requests directly.
          headers:
            Location: {schema: {type: string, format: uri}}
        '200':
          description: Media headers
        '403':
          description: Invalid or expired URL
        '404':
          "$ref": "#/components/responses/NotFound"
      operationId: head_media_id
      description: Use the exact signed URL returned by media-access, without a Gateway
        key. Signature and expiry are required. Do not construct signatures in clients.
        Supports HEAD, Range and download=1.
