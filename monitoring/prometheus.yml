global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Docker DNS returns every replica; refresh after container replacement.
  - job_name: gateway
    dns_sd_configs:
      - names: ["gateway"]
        type: A
        port: 9091
        refresh_interval: 15s

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9091
        refresh_interval: 15s
