apiVersion: 1

datasources:
  - name: Prometheus
    uid: gateway-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
      manageAlerts: false
